<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
<title>B8-24F 3D 模型</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1b1d22; font-family: system-ui, "PingFang TC", sans-serif; }
  #ui {
    position: fixed; top: calc(12px + env(safe-area-inset-top)); left: calc(12px + env(safe-area-inset-left)); z-index: 30;   /* 選單在最上層：不會被背包快捷欄 / 提示蓋住而誤點 */
    background: rgba(20, 22, 28, .85); color: #e8e8e8; padding: 12px 14px;
    border-radius: 8px; font-size: 13px; line-height: 1.7; max-width: 280px;
  }
  #ui h1 { font-size: 15px; margin: 0 0 6px; cursor: pointer; user-select: none; display: flex; justify-content: space-between; gap: 12px; }
  #ui h1 .arrow { font-size: 12px; opacity: .7; }
  #ui.collapsed h1 { margin: 0; }
  #ui.collapsed #uiBody { display: none; }
  #ui button { margin: 4px 4px 0 0; padding: 4px 10px; border: 0; border-radius: 4px; background: #3d6fd8; color: #fff; cursor: pointer; }
  #ui button.off { background: #555; }
  #ui kbd { background: #333; border-radius: 3px; padding: 0 4px; font-size: 12px; }
  .legend span { display: inline-block; width: 12px; height: 12px; vertical-align: middle; margin-right: 4px; border-radius: 2px; }
  #hint {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 18px; pointer-events: none; text-shadow: 0 0 6px #000;
  }
  #furnHud { position: fixed; left: 50%; bottom: 96px; transform: translateX(-50%); padding: 6px 12px; border-radius: 8px; background: rgba(20,22,28,.78); color: #ffd24a; font: 600 15px/1.45 system-ui, sans-serif; text-align: center; display: none; pointer-events: none; z-index: 20; }
  #furnHud span { color: #e8e2d6; font-weight: 400; font-size: 13px; } #furnHud small { color: #aaa; font-weight: 400; }
  #bagBar { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); display: none; gap: 6px; z-index: 21; }
  #bagBar .slot { width: 64px; height: 64px; border-radius: 8px; border: 2px solid rgba(255,255,255,.35); background: rgba(20,22,28,.7); color: #f3efe6; font: 600 12px/1.25 system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; cursor: pointer; padding: 2px; box-sizing: border-box; }
  #bagBar .slot b { color: #ffd24a; font-size: 11px; }
  #bagBar .slot.empty { opacity: .45; cursor: default; }
  /* 手機拿著家具時的「Y 轉 / X 翻 / Z 翻 / 收 / 取消」：直式排成一列放在右下按鍵上方；橫式（高度不夠）改放在右下按鍵左邊、貼底 */
  #furnTouch { position: fixed; right: calc(18px + env(safe-area-inset-right)); bottom: calc(262px + env(safe-area-inset-bottom)); display: none; flex-direction: row; gap: 8px; z-index: 22; }
  #furnTouch .row { display: flex; gap: 8px; }
  /* 微調小鍵（1cm、依畫面方向）：拿著家具時出現在虛擬搖桿的上 / 下 / 左 / 右邊緣（搖桿 124px、左下 22px），中間照常可以推搖桿移動 */
  #furnPad { display: none; position: fixed; left: env(safe-area-inset-left); bottom: env(safe-area-inset-bottom); width: 0; height: 0; z-index: 23; }
  #furnPad button { position: fixed; width: 38px; height: 34px; border-radius: 8px; border: 2px solid rgba(255,210,74,.8); background: rgba(20,22,28,.8); color: #ffd24a; font: 700 13px system-ui, sans-serif; padding: 0; }
  #furnPad .u { left: calc(65px + env(safe-area-inset-left)); bottom: calc(129px + env(safe-area-inset-bottom)); }
  #furnPad .d { left: calc(65px + env(safe-area-inset-left)); bottom: calc(5px + env(safe-area-inset-bottom)); }
  #furnPad .l { left: calc(3px + env(safe-area-inset-left)); bottom: calc(67px + env(safe-area-inset-bottom)); }
  #furnPad .r { left: calc(127px + env(safe-area-inset-left)); bottom: calc(67px + env(safe-area-inset-bottom)); }
  #furnTouch button { width: 54px; height: 44px; border-radius: 12px; border: 2px solid rgba(255,210,74,.7); background: rgba(20,22,28,.75); color: #ffd24a; font: 700 14px system-ui, sans-serif; padding: 0; }
  @media (orientation: landscape) and (max-height: 600px) {
    #furnTouch { right: calc(172px + env(safe-area-inset-right)); bottom: calc(26px + env(safe-area-inset-bottom)); }
  }
  @media (pointer: coarse) {                                                       /* 手機：背包快捷欄移到上方（下方是搖桿與按鍵），格子縮小 */
    #bagBar { top: calc(10px + env(safe-area-inset-top)); bottom: auto; left: auto; right: calc(10px + env(safe-area-inset-right)); transform: none; gap: 4px; }   /* 靠右上，避開左上選單 */
    #bagBar .slot { width: 36px; height: 40px; font-size: 9px; border-radius: 6px; }
    #furnHud { top: calc(58px + env(safe-area-inset-top)); bottom: auto; font-size: 13px; max-width: 90vw; }
  }
  #rulerHud { position: fixed; left: 50%; top: calc(50% + 22px); transform: translateX(-50%); padding: 6px 12px; border-radius: 8px; background: rgba(20,20,22,.75); color: #ffd24a; font: 600 15px/1.45 system-ui, sans-serif; text-align: center; display: none; pointer-events: none; white-space: nowrap; z-index: 20; }
  #rulerHud span { color: #e8e2d6; font-weight: 400; font-size: 13px; } #rulerHud small { color: #aaa; font-weight: 400; }
  /* 準星：白色十字 + 深色描邊（白牆上也看得到）；對到可互動 / 可搬的東西 → 變黃、外圈亮起 */
  #cross { position: fixed; left: 50%; top: 50%; width: 22px; height: 22px; margin: -11px; display: none; pointer-events: none; z-index: 15; }
  #cross::before, #cross::after { content: ''; position: absolute; left: 50%; top: 50%; background: #fff; box-shadow: 0 0 0 1px rgba(0,0,0,.55); transform: translate(-50%, -50%); }
  #cross::before { width: 14px; height: 2px; } #cross::after { width: 2px; height: 14px; }
  #cross.hot { border: 2px solid #ffd24a; border-radius: 50%; box-shadow: 0 0 0 1px rgba(0,0,0,.45), inset 0 0 0 1px rgba(0,0,0,.25); box-sizing: border-box; }
  #cross.hot::before, #cross.hot::after { background: #ffd24a; }
  /* ---------- 手機 / 平板觸控 ---------- */
  /* 畫布固定鋪滿整個螢幕（含 iPhone 瀏海 / 手勢條區域），避免橫向時出現黑邊 */
  canvas { touch-action: none; position: fixed; left: 0; top: 0; display: block; width: 100vw !important; height: 100vh !important; height: 100dvh !important; }
  #touchUI { display: none; }
  #touchUI.on { display: block; }
  #touchUI.orbit .walkOnly { display: none; }
  #joyBase { position: fixed; left: calc(22px + env(safe-area-inset-left)); bottom: calc(22px + env(safe-area-inset-bottom)); width: 124px; height: 124px; border-radius: 50%;
    background: rgba(255,255,255,.12); border: 2px solid rgba(255,255,255,.35); touch-action: none; z-index: 20; }
  #joyStick { position: absolute; left: 37px; top: 37px; width: 50px; height: 50px; border-radius: 50%; background: rgba(255,255,255,.6); pointer-events: none; }
  #touchBtns { position: fixed; right: calc(18px + env(safe-area-inset-right)); bottom: calc(26px + env(safe-area-inset-bottom)); display: grid; grid-template-columns: 64px 64px; grid-template-areas: '. use' 'furn ruler' 'jump posture'; gap: 12px; z-index: 20; }
  #btnFurnT { grid-area: furn; }
  #btnUse { grid-area: use; } #btnRulerT { grid-area: ruler; } #btnJump { grid-area: jump; } #btnPosture { grid-area: posture; }   /* 右排：開關 / 量尺 / 姿勢；跳在姿勢左邊 */
  #touchBtns button.ready { background: rgba(255,210,74,.9); color: #222; border-color: #ffd24a; }
  #touchBtns button { width: 64px; height: 64px; border-radius: 50%; border: 2px solid rgba(255,255,255,.4); background: rgba(20,22,28,.6);
    color: #fff; font-size: 15px; font-family: inherit; touch-action: manipulation; }
  @media (max-width: 640px) {
    #ui.collapsed { padding: 8px 12px; }
    #ui.collapsed h1 .arrow::after { content: ' 選單'; font-size: 12px; }
    #ui { font-size: 12px; line-height: 1.6; max-width: calc(100vw - 110px); padding: 10px 12px; }
    #ui h1 { font-size: 14px; }
    #ui button { padding: 6px 10px; }
  }
</style>

<div id="ui">
  <h1 id="uiToggle" title="點擊收合 / 展開">B8-24F 3D 模型<span class="arrow">▾</span></h1>
  <div id="uiBody">
  <div id="modeText"></div>
  <div id="luxText" style="margin:2px 0 4px;color:#ffd98a"></div>
  <div>
    <button id="btnMode">切換：俯瞰模式</button>
    <button id="btnCeil">天花板：開</button>
    <button id="btnShot">截圖</button>
    <button id="btnRuler" class="off">量尺：關</button>
    <button id="btnRulerClear">清除量測</button>
    <button id="btnBag">背包</button>
    <button id="btnDoors" class="off">櫃門：全關</button>
    <button id="btnBright">曝光：標準</button>
    <button id="btnFire">消防管線：開</button>

  </div>
  <div id="postures" style="margin-top:6px">視角（身高 172cm）：<br>
    <button data-p="0">站立</button><button data-p="1" class="off">坐下</button><button data-p="2" class="off">蹲下</button><button data-p="3" class="off">躺下</button>
  </div>
  <div class="legend" style="display:none">
    <div><span style="background:#ffffff"></span>RC 牆／柱</div>

  </div>
  </div>

<script>
  // 操作面板收合：點標題切換，狀態記在 localStorage
  (() => {
    const ui = document.getElementById('ui'), arrow = ui.querySelector('.arrow');
    const set = (c) => { ui.classList.toggle('collapsed', c); arrow.textContent = c ? '▸' : '▾'; localStorage.setItem('uiCollapsed', c ? '1' : ''); };
    const saved = localStorage.getItem('uiCollapsed');
    set(saved === null ? matchMedia('(pointer: coarse)').matches : saved === '1');   // 手機第一次開啟時預設收合
    document.getElementById('uiToggle').addEventListener('click', () => set(!ui.classList.contains('collapsed')));
  })();
</script>
<div id="hint">點擊畫面進入室內漫遊</div>
<div id="cross"></div>
<div id="rulerHud"></div>
<div id="furnHud"></div>
<div id="bagBar"></div>
<div id="furnPad"><button data-a="up" class="u">▲</button><button data-a="left" class="l">◀</button><button data-a="right" class="r">▶</button><button data-a="down" class="d">▼</button></div>
<div id="furnTouch"><div class="row"><button data-a="rot">Y 轉</button><button data-a="flip">X 翻</button><button data-a="flipz">Z 翻</button><button data-a="store">收</button><button data-a="cancel">取消</button></div></div>
<div id="touchUI">
  <div id="joyBase" class="walkOnly"><div id="joyStick"></div></div>
  <div id="touchBtns" class="walkOnly"><button id="btnUse">開關</button><button id="btnRulerT">量尺</button><button id="btnFurnT">搬</button><button id="btnJump">跳</button><button id="btnPosture">站</button></div>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",

<script type="module">
import * as THREE from 'three';
import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RectAreaLightUniformsLib } from 'three/addons/lights/RectAreaLightUniformsLib.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';


// 觸控裝置（手機 / 平板）：改用虛擬搖桿 + 拖曳轉視角，解析度上限降低以維持流暢
const IS_TOUCH = matchMedia('(pointer: coarse)').matches || 'ontouchstart' in window;

// ---------- 比例與高度設定 ----------
// 依「20240726大亮泊客變(B8-24F)(客變).dwg」下方那張客變後平面（開放格局）。CAD 單位為 cm；
// 沿用 A10 模型的比例 1 px = 0.98 cm：px = (CAD X - 3290) / 0.98、py = (60 - CAD Y) / 0.98
const CM_PER_PX = 0.98;
const CEIL_H = 320;   // 樓板下淨高（cm）：沿用 A10（同棟），B8-24F 尚未現場確認
const SLAB = 15;      // 樓板厚（cm），樑深扣掉樓板即為樑下垂量
const DOOR_H = 210;   // 門高
const SILL_H = 90;    // 窗台高（CAD 未標，沿用 A10）
const WIN_TOP = 210;  // 窗頂高
const ORIGIN = { x: 336, y: 370 }; // 平面圖中心（px）

const px2m = (p) => p * CM_PER_PX / 100;
const cm2m = (c) => c / 100;

// ---------- 場景 ----------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, IS_TOUCH ? 1.25 : 1.5));   // 逐像素光照成本與像素數成正比，Retina 2x 會慢約 4 倍
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.toneMapping = THREE.ACESFilmicToneMapping;   // 讓燈光亮處自然收斂，不會過曝成一片白
renderer.toneMappingExposure = 1.1 / 118;   // 實際單位：光源用 cd / lx / nit，曝光把「白牆 200 lx」對到舒適的畫面亮度（見 EXPOSURES）
renderer.shadowMap.type = THREE.BasicShadowMap;   // 陰影主要用來讓牆擋住房間補光（避免漏光），硬邊即可；柔邊 PCF 取樣成本約讓 FPS 減半
// 場景靜態：陰影只在載入與切換顯示（展示櫃、天花板）時重算，不必每幀更新
renderer.shadowMap.autoUpdate = false;
renderer.shadowMap.needsUpdate = true;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1b1d22);

const camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.05, 200);

// 環境光 = 各房間的間接光（燈光在牆面、天花之間來回反射後的照度，lx）。
// HemisphereLight 強度固定為 1，實際數值由材質 shader 依所在房間乘上該房間的間接照度（見檔案末「實際照度」段）。
const ambient = new THREE.HemisphereLight(0xfff0dc, 0xd9cfc0, 1);
// 朝下的面（天花、樑底、降板底）額外 +40%：崁燈的直射光多半落在地板，地板再往上反射，實際天花比「平均間接光」亮，
// 不加的話天花、樑底、凹處會整片偏灰
ambient.groundColor.setRGB(1.4 * 0.851, 1.4 * 0.812, 1.4 * 0.753);
scene.add(ambient);
// 曝光 = 眼睛 / 相機的適應程度；標準值讓 200 lx 下的白牆呈現舒適亮度
const EXPOSURES = [{ name: '標準', k: 1 }, { name: '+1 EV（眼睛適應暗處）', k: 2 }, { name: '-1 EV', k: 0.5 }];
const SUN_LX = 250;                                   // 俯瞰模式（天花板關閉）用的平行補光；天花板開啟時關掉，室內只剩燈具
const sun = new THREE.DirectionalLight(0xffffff, 0);
sun.position.set(6, 12, 4);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -8, right: 8, top: 8, bottom: -8 });
scene.add(sun);

// ---------- 材質 ----------
// 淺木紋地板：canvas 程序產生，一張貼圖代表 120cm x 80cm（4 片 20cm 寬地板）
const WOOD_TILE = { w: 1.2, d: 0.8 };
function makeWoodTexture() {
  const c = document.createElement('canvas');
  c.width = 1024; c.height = 683;
  const ctx = c.getContext('2d');
  const plankH = c.height / 4;
  const tones = ['#e3cfae', '#dcc7a3', '#e8d6b8', '#d9c29c'];
  for (let i = 0; i < 4; i++) {
    const y = i * plankH;
    const offset = (i % 2) * c.width / 2; // 錯縫
    for (const x0 of [offset - c.width, offset]) {
      ctx.fillStyle = tones[(i + (x0 < 0 ? 1 : 0)) % tones.length];
      ctx.fillRect(x0, y, c.width, plankH);
      // 木紋
      for (let k = 0; k < 14; k++) {
        ctx.strokeStyle = `rgba(150,110,70,${0.06 + Math.random() * 0.08})`;
        ctx.lineWidth = 1 + Math.random() * 2;
        const gy = y + Math.random() * plankH;
        ctx.beginPath();
        ctx.moveTo(x0, gy);
        for (let x = 0; x <= c.width; x += 64) ctx.lineTo(x0 + x, gy + Math.sin(x / 90 + k) * 3);
        ctx.stroke();
      }
      // 端縫
      ctx.fillStyle = 'rgba(120,90,60,.35)';
      ctx.fillRect(x0 + c.width - 2, y, 2, plankH);
    }
    // 長邊縫
    ctx.fillStyle = 'rgba(120,90,60,.4)';
    ctx.fillRect(0, y + plankH - 2, c.width, 2);
  }
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return t;
}
const woodTexture = makeWoodTexture();

const mat = {
  rc:    new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.9 }),
  light: new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.9 }),
  wet:   new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.7 }),
  beam:  new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.9 }),
  tile:  new THREE.MeshStandardMaterial({ color: 0xf4f4f4, roughness: 0.5 }),
  ceil:  new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 1, side: THREE.DoubleSide }),
  glass: new THREE.MeshStandardMaterial({ color: 0x88c4ff, transparent: true, opacity: 0.25, roughness: 0.05 }),
  frame: new THREE.MeshStandardMaterial({ color: 0x333333 }),
  door:  new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.6 }),
  white: new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.3 }),
  cabinet: new THREE.MeshStandardMaterial({ color: 0xd3d5d8, roughness: 0.5 }),
  ac:    new THREE.MeshStandardMaterial({ color: 0xd0d0d0 }),
};

// 每塊地板依尺寸設定貼圖重複次數，讓木紋比例一致
function woodFloorMaterial(r) {
  const t = woodTexture.clone();
  t.needsUpdate = true;
  t.repeat.set(px2m(r[2] - r[0]) / WOOD_TILE.w, px2m(r[3] - r[1]) / WOOD_TILE.d);
  return new THREE.MeshStandardMaterial({ map: t, roughness: 0.75 });
}

// 平面碰撞用矩形（px 座標）
const solids = [];

// 以平面圖 px 座標 (x1,y1)-(x2,y2) 與高度區間 z0~z1 (cm) 建立方塊
// 碰撞矩形的「原位」備份（capture / movable / grabSince 用來還原或加位移）：搬家具時要一起跟著搬，所以集中登記
const RECT_BASE = new Map();                                                         // r → [原位陣列, ...]
const addBase = (r, o) => { (RECT_BASE.get(r) || RECT_BASE.set(r, []).get(r)).push(o); };
// 可搬動的家具（「搬家具」模式 / 背包）：itemMark() 記下起點，蓋完家具後 itemEnd(名稱, mark) 把新增的物件包成一個以中心為軸的群組
const ITEMS = [];
const itemMark = () => [scene.children.length, solids.length];
function itemEnd(name, [n, ns], opt) {
  const kids = scene.children.slice(n);
  if (!kids.length) return null;
  return makeItem(name, kids, scene, solids.slice(ns), opt);
}
// 把已經在場景裡的物件（可在任何父群組下，父群組只能平移）包成可搬家具；small = 小物件（杯子、書、床墊）：不檢查碰撞、放下時貼著下面的表面
function itemFromObject(name, obj, rects = [], opt) { return makeItem(name, [obj], obj.parent, rects, opt); }
function makeItem(name, kids, parent, rectList, { small = false } = {}) {
  parent.updateMatrixWorld(true);
  const b = new THREE.Box3(); kids.forEach(o => b.expandByObject(o));
  const c = b.getCenter(new THREE.Vector3()), sz = b.getSize(new THREE.Vector3()), pw = parent.getWorldPosition(new THREE.Vector3());
  // pivot（平移 + 水平轉向）→ tilt（垂直翻轉，繞家具中心高度的水平軸）→ inner（原本的物件）
  const pivot = new THREE.Group(), tilt = new THREE.Group(), inner = new THREE.Group(), hc = c.y - pw.y;
  pivot.position.set(c.x - pw.x, 0, c.z - pw.z); tilt.position.y = hc; inner.position.set(-(c.x - pw.x), -hc, -(c.z - pw.z));

// 有效立體角對 three.js 聚光燈的邊緣衰減（penumbra 0.6）做積分，確保整個光錐的總光通量等於 lm。
// 假設的燈具規格（一般市售 LED）：崁燈一律 7.5cm 開孔、8W ≈ 720 lm、泛光型（光束角約 90~100°）、AR111 燈頭 9W ≈ 700 lm、
// 軌道投射燈 7W ≈ 600 lm、餐桌線型吊燈 20W ≈ 1800 lm、燈條 10W/m ≈ 800 lm/m。換燈具時改各處的 lm 即可。
const ROOM_LM = {};                                    // 各房間燈具總光通量（估算間接光用）
function coneSr(angleDeg, penumbra = 0.6) {
  const a = THREE.MathUtils.degToRad(angleDeg / 2), c0 = Math.cos(a), c1 = Math.cos(a * (1 - penumbra)), N = 240;

function spot(from, to, { color = WARM, lm = 600, angle = 30, distance = 7, room } = {}) {

function makeScreenTexture() {
  const c = document.createElement('canvas');
  c.width = 512; c.height = 288;
  const g = c.getContext('2d');
  const sky = g.createLinearGradient(0, 0, 0, 180);
  sky.addColorStop(0, '#3f86c6'); sky.addColorStop(1, '#bfdcef');
  g.fillStyle = sky; g.fillRect(0, 0, 512, 288);
  g.fillStyle = 'rgba(255,255,255,.85)';
  [[90, 60, 90, 30], [150, 90, 70, 22], [380, 50, 60, 16]].forEach(([x, y, rx, ry]) => {
    g.beginPath(); g.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2); g.fill();
  });
  const ridge = (color, pts) => {
    g.fillStyle = color; g.beginPath(); g.moveTo(0, 288);
    pts.forEach(([x, y]) => g.lineTo(x, y)); g.lineTo(512, 288); g.fill();
  };
  ridge('#4c5d6e', [[0, 150], [120, 120], [220, 140], [330, 95], [430, 110], [512, 100]]);
  ridge('#4f6b3a', [[0, 190], [140, 165], [260, 185], [400, 150], [512, 170]]);
  ridge('#8a9a4c', [[0, 240], [200, 210], [360, 220], [512, 200]]);
  g.strokeStyle = '#9a9a9a'; g.lineWidth = 14;
  g.beginPath(); g.moveTo(0, 270); g.bezierCurveTo(200, 230, 330, 290, 430, 210); g.stroke();
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

  scene.children.slice(n).forEach(o => g.add(o));

  rects.forEach(([r, o]) => addBase(r, o));

    g, show(on) { g.visible = on; rects.forEach(([r, o]) => o.forEach((v, i) => { r[i] = on ? v : -9999; })); },
    rects: rects.map(([r]) => r),

// 5. 更衣區：有 290 降板，保留 1 盞崁燈；後陽台：防水吸頂燈
// 色溫：客廳 / 床區 3000K 暖光、廚房軌道 4000K
{
  const C = CEIL_H;
  const ceilingLamp = (x, y, dCm, lm, room, color = WARM, drop = 0) => {               // 吸頂燈：白色燈體 + 乳白發光面；drop > 0 = 用短吊桿降下（閃過消防管）

    cyl(x, y, dCm / 2 - 2, z - 9.3, z - 9, fixtureMat.lamp);
    spot(P(x, y, z - 10), P(x, y, 0), { color, angle: 150, lm, distance: 6, room });

  // 吊鋼約每 1m 一組（兩端 + 中間），頂端白色小吸頂座

    else box(x1 - w, Math.min(y1, y2), x1 + w, Math.max(y1, y2), ZT - 4, ZT, fixtureMat.black);
    const L = Math.hypot(x2 - x1, y2 - y1), n = Math.max(1, Math.round(L / cm2px(100)));

    { x: 330, y: 105, aim: P(285, 45, 150) },                                             // 電視左側牆面
    { x: 330, y: 125, aim: P(430, 45, 150) },                                             // 電視右側牆面

    { x: 330, y: 455, aim: P(330, 450, 0), angle: 60 },                                   // 沙發後走道（往穀倉門 / 冰箱）
  ], 'living');
  // 3. 廚房 + 玄關軌道：x 543（廚房檯面前緣 x 573.6 往外約 30cm），y 70~470
  track(543, 70, 543, 470, [
    { x: 543, y: 100, aim: P(600, 120, 100) },                                            // 玄關鞋櫃

  ceilingLamp(240, 607, 50, 3000, 'living');
  // 5. 更衣區崁燈（290 降板）+ 後陽台防水吸頂燈
  { const x = 137, y = 330, c = ceilAt(x, y); cyl(x, y, 4.5, c - 0.4, c, fixtureMat.white); cyl(x, y, 3.75, c - 0.6, c - 0.4, fixtureMat.lamp); spot(P(x, y, c - 1), P(x, y, 0), { angle: 110, lm: 720, distance: 5, room: 'living' }); }

addEventListener('keydown', (e) => {
  if (e.code === 'Tab') { e.preventDefault(); setMode(mode === 'walk' ? 'orbit' : 'walk'); return; }
  if (e.code === 'KeyC' && !e.repeat) setPosture((posture + 1) % POSTURES.length);
  if ((e.code === 'KeyE' || e.code === 'KeyF') && !e.repeat && mode === 'walk' && walk.isLocked) interact(CENTER, 3.2);
  if (e.code === 'Space') {                       // 跳：起跳速度 3.5 m/s、重力 9.8 → 約跳高 62cm；擋掉空白鍵觸發最後點過的按鈕
    e.preventDefault();
    if (!e.repeat && mode === 'walk' && walk.isLocked && jumpV === 0) jumpV = 3.5;   // 站在地上或家具上時才能起跳（起跳 3.5 m/s → 跳高約 62cm）
  }
  keys[e.code] = true;
});
addEventListener('keyup', (e) => { keys[e.code] = false; });

// 腳下地面高度（m）：玩家中心落在有 top（cm）的矮家具上、且頂面不高於目前腳高 + 5cm 時，就站在它上面
function groundAt(xm, zm) {
  const x = xm * 100 / CM_PER_PX + ORIGIN.x, y = zm * 100 / CM_PER_PX + ORIGIN.y;
  let g = 0;
  for (const s of solids) {
    if (s.top === undefined || s.top / 100 > jumpY + 0.05) continue;
    if (x >= s[0] && x <= s[2] && y >= s[1] && y <= s[3]) g = Math.max(g, s.top / 100);
  }
  return g;
}
// 2D 圓形 vs 矩形碰撞（px 座標）
const RADIUS_PX = 20;
function blocked(xm, zm) {
  const x = xm * 100 / CM_PER_PX + ORIGIN.x;
  const y = zm * 100 / CM_PER_PX + ORIGIN.y;
  return solids.some((s) => {
    if (posture !== 0 && s.seat) return false;
    if (s.gate && s.gate.open) return false;
    if (s.top !== undefined && jumpY >= s.top / 100 - 0.02) return false;   // 有高度的矮家具：腳高過它的頂面就能越過 / 站上去        // 房門 / 拉門開著時可通過      // 坐下 / 蹲下 / 躺下時可進入沙發、椅子、床、架高地板
    const [x1, y1, x2, y2] = s;
    const cx = Math.max(x1, Math.min(x, x2));
    const cy = Math.max(y1, Math.min(y, y2));
    return (x - cx) ** 2 + (y - cy) ** 2 < RADIUS_PX ** 2;
  });
}

const clock = new THREE.Clock();
let jumpY = 0, jumpV = 0, eyeY = EYE;              // 腳底離地高度（m，站在家具上 > 0）/ 垂直速度（m/s）/ 目前姿勢眼高（平滑過渡）
let hoverT = 0;
const fwd = new THREE.Vector3(), right = new THREE.Vector3();
function tick() {
  const dt = Math.min(clock.getDelta(), 0.05);
  // 櫃門 / 抽屜補間
  let moving = false;
  movers.forEach(m => {
    const target = m.open ? 1 : 0;
    if (m.t === target) return;
    m.t = target > m.t ? Math.min(1, m.t + dt * 2.4) : Math.max(0, m.t - dt * 2.4);
    m.apply(m.t * m.t * (3 - 2 * m.t));
    moving = true;
  });
  if (moving) renderer.shadowMap.needsUpdate = true;
  updateLux(dt);
  if (mode === 'walk' && (walk.isLocked || IS_TOUCH)) {
    const speed = (keys.ShiftLeft || keys.ShiftRight ? 3.2 : 1.6) * dt;
    camera.getWorldDirection(fwd);
    fwd.y = 0; fwd.normalize();
    right.crossVectors(fwd, camera.up).normalize();
    const mv = new THREE.Vector3();
    if (keys.KeyW) mv.add(fwd);
    if (keys.KeyS) mv.sub(fwd);
    if (keys.KeyD) mv.add(right);
    if (keys.KeyA) mv.sub(right);
    if (joy.active) { mv.addScaledVector(fwd, -joy.y); mv.addScaledVector(right, joy.x); }   // 觸控搖桿
    if (mv.lengthSq() > 0) {
      mv.normalize().multiplyScalar(speed * (joy.active ? Math.min(1, Math.hypot(joy.x, joy.y)) : 1));   // 搖桿推越遠走越快
      const p = camera.position;
      const stuck = blocked(p.x, p.z);              // 已卡在物件內時放行，避免完全無法移動
      if (stuck || !blocked(p.x + mv.x, p.z)) p.x += mv.x;   // 分軸移動，可沿牆滑行
      if (stuck || !blocked(p.x, p.z + mv.z)) p.z += mv.z;
    }
    eyeY += (POSTURES[posture].eye - eyeY) * Math.min(1, dt * 8);
    const ground = groundAt(camera.position.x, camera.position.z);
    if (jumpV !== 0 || jumpY > ground) { jumpV -= 9.8 * dt; jumpY += jumpV * dt; if (jumpY <= ground) { jumpY = ground; jumpV = 0; } }   // 跳躍 / 從家具上走下去會掉下來
    else jumpY = ground;
    camera.position.y = eyeY + jumpY;
    // 準星對到可開關的櫃門時變色提示
    hoverT += dt;
    if (false) {                                     // 準星對到可開關的東西：改由 furn.hoverMover 處理（黃框高亮 + 準星變黃，俯瞰模式也有）
      hoverT = 0;
      const target = pick(CENTER, IS_TOUCH ? 3.5 : 3.2);
      cross.style.background = target ? '#ffd24a' : 'rgba(255,255,255,.7)';
      if (IS_TOUCH) btnUse.classList.toggle('ready', !!target);
    }
  }
  if (orbit.enabled) orbit.update();
  ruler.update(mode === 'walk' ? CENTER : mouseNdc, dt);
  furn.update(mode === 'walk' ? CENTER : mouseNdc, dt);
  tape.frame(dt, mode === 'walk');
  const shotHide = shotPending ? scene.children.filter(o => o.userData.noShot && o.visible) : [];   // 截圖這一幀：藏起高亮框 / 落點框 / 量尺游標和手
  shotHide.forEach(o => { o.visible = false; });
  renderer.render(scene, camera);
  if (!shotPending) tape.draw();
  shotHide.forEach(o => { o.visible = true; });
  if (shotPending) {                                                     // 截圖：剛畫完這一幀就讀畫布（不用開 preserveDrawingBuffer）
    shotPending = false;
    renderer.domElement.toBlob(b => {
      const d = new Date(), p = n => String(n).padStart(2, '0');
      const a = document.createElement('a');
      a.href = URL.createObjectURL(b);
      a.download = `B8-24F-${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}.png`;
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    }, 'image/png');
  }
  requestAnimationFrame(tick);
}

// 依畫布實際顯示大小調整解析度與比例（iOS Safari 轉向後 innerWidth / innerHeight 會延遲更新，所以轉向後再補算一次）
function fitCanvas() {
  const c = renderer.domElement, w = c.clientWidth || innerWidth, h = c.clientHeight || innerHeight;
  camera.aspect = w / h;
  // 視野：水平固定約 90°（一般 FPS 遊戲的預設值），依螢幕比例換算垂直視角；直式手機螢幕最多 70°
  // （原本垂直 70° 在 16:9 螢幕上等於水平約 100°，近牆時畫面邊緣拉伸大、轉頭時容易暈）
  camera.fov = Math.min(70, THREE.MathUtils.radToDeg(2 * Math.atan(Math.tan(THREE.MathUtils.degToRad(90 / 2)) / camera.aspect)));
  camera.updateProjectionMatrix();
  renderer.setSize(w, h, false);
}
addEventListener('resize', fitCanvas);
addEventListener('orientationchange', () => { setTimeout(fitCanvas, 150); setTimeout(fitCanvas, 600); });
if (window.visualViewport) visualViewport.addEventListener('resize', fitCanvas);
fitCanvas();

updateUI();
tick();
</script>
</body>
