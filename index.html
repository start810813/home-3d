<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1b1d22; font-family: system-ui, "PingFang TC", sans-serif; }
  #ui {
    position: fixed; top: calc(12px + env(safe-area-inset-top)); left: calc(12px + env(safe-area-inset-left)); z-index: 10;
    background: rgba(20, 22, 28, .85); color: #e8e8e8; padding: 12px 14px;
    border-radius: 8px; font-size: 13px; line-height: 1.7; max-width: 280px;
  }
  #ui h1 { font-size: 15px; margin: 0 0 6px; cursor: pointer; user-select: none; display: flex; justify-content: space-between; gap: 12px; }
  #ui h1 .arrow { font-size: 12px; opacity: .7; }
  #ui.collapsed h1 { margin: 0; }
  #ui.collapsed #uiBody { display: none; }
  #ui button { margin: 4px 4px 0 0; padding: 4px 10px; border: 0; border-radius: 4px; background: #3d6fd8; color: #fff; cursor: pointer; }
  #ui button.off { background: #555; }
  #ui kbd { background: #333; border-radius: 3px; padding: 0 4px; font-size: 12px; }
  .legend span { display: inline-block; width: 12px; height: 12px; vertical-align: middle; margin-right: 4px; border-radius: 2px; }
  #hint {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 18px; pointer-events: none; text-shadow: 0 0 6px #000;
  }
  #rulerHud { position: fixed; left: 50%; top: calc(50% + 22px); transform: translateX(-50%); padding: 6px 12px; border-radius: 8px; background: rgba(20,20,22,.75); color: #ffd24a; font: 600 15px/1.45 system-ui, sans-serif; text-align: center; display: none; pointer-events: none; white-space: nowrap; z-index: 20; }
  #rulerHud span { color: #e8e2d6; font-weight: 400; font-size: 13px; } #rulerHud small { color: #aaa; font-weight: 400; }
  #cross { position: fixed; left: 50%; top: 50%; width: 6px; height: 6px; margin: -3px; border-radius: 50%; background: rgba(255,255,255,.7); display: none; }
  /* ---------- 手機 / 平板觸控 ---------- */
  /* 畫布固定鋪滿整個螢幕（含 iPhone 瀏海 / 手勢條區域），避免橫向時出現黑邊 */
  canvas { touch-action: none; position: fixed; left: 0; top: 0; display: block; width: 100vw !important; height: 100vh !important; height: 100dvh !important; }
  #touchUI { display: none; }
  #touchUI.on { display: block; }
  #touchUI.orbit .walkOnly { display: none; }
  #joyBase { position: fixed; left: calc(22px + env(safe-area-inset-left)); bottom: calc(22px + env(safe-area-inset-bottom)); width: 124px; height: 124px; border-radius: 50%;
    background: rgba(255,255,255,.12); border: 2px solid rgba(255,255,255,.35); touch-action: none; z-index: 20; }
  #joyStick { position: absolute; left: 37px; top: 37px; width: 50px; height: 50px; border-radius: 50%; background: rgba(255,255,255,.6); pointer-events: none; }
  #touchBtns { position: fixed; right: calc(18px + env(safe-area-inset-right)); bottom: calc(26px + env(safe-area-inset-bottom)); display: grid; grid-template-columns: 64px 64px; grid-template-areas: '. use' '. ruler' 'jump posture'; gap: 12px; z-index: 20; }
  #btnUse { grid-area: use; } #btnRulerT { grid-area: ruler; } #btnJump { grid-area: jump; } #btnPosture { grid-area: posture; }   /* 右排：開關 / 量尺 / 姿勢；跳在姿勢左邊 */
  #touchBtns button.ready { background: rgba(255,210,74,.9); color: #222; border-color: #ffd24a; }
  #touchBtns button { width: 64px; height: 64px; border-radius: 50%; border: 2px solid rgba(255,255,255,.4); background: rgba(20,22,28,.6);
    color: #fff; font-size: 15px; font-family: inherit; touch-action: manipulation; }
  @media (max-width: 640px) {
    #ui.collapsed { padding: 8px 12px; }
    #ui.collapsed h1 .arrow::after { content: ' 選單'; font-size: 12px; }
    #ui { font-size: 12px; line-height: 1.6; max-width: calc(100vw - 110px); padding: 10px 12px; }
    #ui h1 { font-size: 14px; }
    #ui button { padding: 6px 10px; }
  }
</style>

<script>
  // 操作面板收合：點標題切換，狀態記在 localStorage
  (() => {
    const ui = document.getElementById('ui'), arrow = ui.querySelector('.arrow');
    const set = (c) => { ui.classList.toggle('collapsed', c); arrow.textContent = c ? '▸' : '▾'; localStorage.setItem('uiCollapsed', c ? '1' : ''); };
    const saved = localStorage.getItem('uiCollapsed');
    set(saved === null ? matchMedia('(pointer: coarse)').matches : saved === '1');   // 手機第一次開啟時預設收合
    document.getElementById('uiToggle').addEventListener('click', () => set(!ui.classList.contains('collapsed')));
  })();
</script>
<div id="hint">點擊畫面進入室內漫遊</div>
<div id="cross"></div>
<div id="rulerHud"></div>
<div id="touchUI">
  <div id="joyBase" class="walkOnly"><div id="joyStick"></div></div>
  <div id="touchBtns" class="walkOnly"><button id="btnUse">開關</button><button id="btnRulerT">量尺</button><button id="btnJump">跳</button><button id="btnPosture">站</button></div>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RectAreaLightUniformsLib } from 'three/addons/lights/RectAreaLightUniformsLib.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { GTAOPass } from 'three/addons/postprocessing/GTAOPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

// 觸控裝置（手機 / 平板）：改用虛擬搖桿 + 拖曳轉視角，解析度上限降低以維持流暢
const IS_TOUCH = matchMedia('(pointer: coarse)').matches || 'ontouchstart' in window;

// ---------- 比例與高度設定 ----------
// 由圖上尺寸線換算：底部 140+10+90+260+35 cm 約佔 548px，約 1 px ≈ 0.98 cm
const CM_PER_PX = 0.98;
const CEIL_H = 320;   // 樓板下淨高（cm），使用者提供
const SLAB = 15;      // 樓板厚（cm），樑深扣掉樓板即為樑下垂量
const DOOR_H = 210;   // 門高
const SILL_H = 60;    // 窗台高（A10 全室低台度窗，離地 60）
const WIN_TOP = 230;  // 窗頂高（依窗型圖：窗台 60 + 下段固定窗 60 + 上段橫拉窗 110）
const WIN_FIX = 60;   // 下段固定窗（FIX）高
const ORIGIN = { x: 500, y: 640 }; // 平面圖中心（px）

const px2m = (p) => p * CM_PER_PX / 100;
const cm2m = (c) => c / 100;

// ---------- 場景 ----------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, IS_TOUCH ? 1.25 : 1.5));   // 逐像素光照成本與像素數成正比，Retina 2x 會慢約 4 倍
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.toneMapping = THREE.ACESFilmicToneMapping;   // 讓燈光亮處自然收斂，不會過曝成一片白
renderer.toneMappingExposure = 1.1 / 118;   // 實際單位：光源用 cd / lx / nit，曝光把「白牆 200 lx」對到舒適的畫面亮度（見 EXPOSURES）
renderer.shadowMap.type = THREE.BasicShadowMap;   // 陰影主要用來讓牆擋住房間補光（避免漏光），硬邊即可；柔邊 PCF 取樣成本約讓 FPS 減半
// 場景靜態：陰影只在載入與切換顯示（展示櫃、天花板）時重算，不必每幀更新
renderer.shadowMap.autoUpdate = false;
renderer.shadowMap.needsUpdate = true;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1b1d22);

const camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.05, 200);

// 環境光 = 各房間的間接光（燈光在牆面、天花之間來回反射後的照度，lx）。
// HemisphereLight 強度固定為 1，實際數值由材質 shader 依所在房間乘上該房間的間接照度（見檔案末「實際照度」段）。
const ambient = new THREE.HemisphereLight(0xfff0dc, 0xd9cfc0, 1);
// 朝下的面（天花、樑底、降板底）額外 +40%：崁燈的直射光多半落在地板，地板再往上反射，實際天花比「平均間接光」亮，
// 不加的話天花、樑底、凹處會整片偏灰
ambient.groundColor.setRGB(1.4 * 0.851, 1.4 * 0.812, 1.4 * 0.753);
scene.add(ambient);
// 曝光 = 眼睛 / 相機的適應程度；標準值讓 200 lx 下的白牆呈現舒適亮度
const EXPOSURES = [{ name: '標準', k: 1 }, { name: '+1 EV（眼睛適應暗處）', k: 2 }, { name: '-1 EV', k: 0.5 }];
const SUN_LX = 250;                                   // 俯瞰模式（天花板關閉）用的平行補光；天花板開啟時關掉，室內只剩燈具
const sun = new THREE.DirectionalLight(0xffffff, 0);
sun.position.set(6, 12, 4);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -8, right: 8, top: 8, bottom: -8 });
scene.add(sun);

// ---------- 材質 ----------
// 超耐磨木地板：Order floor 赫卡奇柏橡-窄版 Khaki Oak 5966（單片 19.5 x 128.8cm，交錯貼）
// canvas 程序產生，一張貼圖 = 2 片長 x 8 排寬 = 257.6cm x 156cm；每排端縫位置不同（交錯、錯開至少約 30cm，不做規則的 1/2 錯縫）
const WOOD_TILE = { w: 2.576, d: 1.56 };
function makeWoodTexture() {
  const c = document.createElement('canvas');
  const ROWS = 8, PL = 128.8;                                     // 排數、單片長（cm）
  c.width = 2048; c.height = Math.round(2048 * 156 / 257.6);
  const ctx = c.getContext('2d');
  const plankH = c.height / ROWS, pxPerCm = c.width / 257.6;
  const tones = ['#c4ae94', '#b9a389', '#cab59c', '#bfa98f', '#b39d85', '#c6b299', '#bba68f'];   // 卡其灰調淺橡木（取自產品照片）
  const offs = [0, 0.38, 0.77, 0.21, 0.6, 0.93, 0.47, 0.13];      // 各排端縫起點（單片長的比例），相鄰排錯開 >= 25%
  let toneK = 0;
  for (let i = 0; i < ROWS; i++) {
    const y = i * plankH, plankW = PL * pxPerCm;
    for (let x0 = offs[i] * plankW - plankW; x0 < c.width; x0 += plankW) {
      const tone = tones[(toneK++ * 3 + i) % tones.length];
      const draw = (sx) => {
        ctx.save(); ctx.beginPath(); ctx.rect(sx, y, plankW, plankH); ctx.clip();
        ctx.fillStyle = tone; ctx.fillRect(sx, y, plankW, plankH);
        // 長條順紋：深淺不一的細線，略帶起伏
        for (let k = 0; k < 26; k++) {
          const dark = Math.random() < 0.6;
          ctx.strokeStyle = dark ? `rgba(120,96,70,${0.05 + Math.random() * 0.12})` : `rgba(235,222,200,${0.06 + Math.random() * 0.1})`;
          ctx.lineWidth = 0.8 + Math.random() * 2.4;
          const gy = y + Math.random() * plankH, ph = Math.random() * 6, amp = 1 + Math.random() * 3;
          ctx.beginPath(); ctx.moveTo(sx, gy);
          for (let x = 0; x <= plankW; x += 48) ctx.lineTo(sx + x, gy + Math.sin(x / 140 + ph) * amp);
          ctx.stroke();
        }
        // 山紋（拉長的橢圓弧）+ 偶爾的小節點
        for (let k = 0; k < 2; k++) {
          const cx = sx + Math.random() * plankW, cy = y + plankH * (0.3 + Math.random() * 0.4);
          for (let r = 1; r <= 4; r++) {
            ctx.strokeStyle = `rgba(110,86,60,${0.07 + Math.random() * 0.06})`; ctx.lineWidth = 1.2;
            ctx.beginPath(); ctx.ellipse(cx, cy, 40 + r * 38, 3 + r * 4.5, 0, 0, Math.PI * 2); ctx.stroke();
          }
          if (Math.random() < 0.5) { ctx.fillStyle = 'rgba(100,76,52,.25)'; ctx.beginPath(); ctx.ellipse(cx + 30, cy, 6, 3, 0, 0, Math.PI * 2); ctx.fill(); }
        }
        ctx.restore();
        ctx.fillStyle = 'rgba(95,75,55,.35)'; ctx.fillRect(sx + plankW - 2, y, 2, plankH);   // 端縫
      };
      draw(x0);
      if (x0 + plankW > c.width) draw(x0 - c.width);              // 跨過右緣的那片，左邊補上，貼圖才能無縫重複
    }
    ctx.fillStyle = 'rgba(95,75,55,.4)'; ctx.fillRect(0, y + plankH - 2, c.width, 2);       // 長邊縫
  }
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return t;
}
const woodTexture = makeWoodTexture();

// 全室牆面 / 天花 / 包樑油漆：立邦 1501 白（接近 #F5F5F5，約 3~5% 灰度的中性白）
const PAINT_1501 = 0xf5f5f5;
const mat = {
  rc:    new THREE.MeshStandardMaterial({ color: PAINT_1501, roughness: 0.9 }),
  light: new THREE.MeshStandardMaterial({ color: PAINT_1501, roughness: 0.9 }),
  wet:   new THREE.MeshStandardMaterial({ color: PAINT_1501, roughness: 0.9 }),   // 浴室隔間牆：外側（客廳 / 走道面）同樣刷 1501，浴室內另貼磁磚
  beam:  new THREE.MeshStandardMaterial({ color: PAINT_1501, roughness: 0.9 }),
  tile:  new THREE.MeshStandardMaterial({ color: 0xf4f4f4, roughness: 0.5 }),
  ceil:  new THREE.MeshStandardMaterial({ color: PAINT_1501, roughness: 1, side: THREE.DoubleSide }),
  glass: new THREE.MeshStandardMaterial({ color: 0x88c4ff, transparent: true, opacity: 0.25, roughness: 0.05 }),
  frame: new THREE.MeshStandardMaterial({ color: 0x333333 }),
  door:  new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.6 }),
  white: new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.3 }),
  cabinet: new THREE.MeshStandardMaterial({ color: 0xd3d5d8, roughness: 0.5 }),
  ac:    new THREE.MeshStandardMaterial({ color: 0xd0d0d0 }),
};

// 每塊地板依尺寸設定貼圖重複次數，讓木紋比例一致
function woodFloorMaterial(r) {
  const t = woodTexture.clone();
  t.needsUpdate = true;
  t.repeat.set(px2m(r[2] - r[0]) / WOOD_TILE.w, px2m(r[3] - r[1]) / WOOD_TILE.d);
  return new THREE.MeshStandardMaterial({ map: t, roughness: 0.75 });
}

// 平面碰撞用矩形（px 座標）
const solids = [];

// 以平面圖 px 座標 (x1,y1)-(x2,y2) 與高度區間 z0~z1 (cm) 建立方塊
function box(x1, y1, x2, y2, z0, z1, material, { collide = false, group = scene } = {}) {
  const w = px2m(Math.abs(x2 - x1)), d = px2m(Math.abs(y2 - y1)), h = cm2m(z1 - z0);
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), material);
  m.position.set(
    px2m((x1 + x2) / 2 - ORIGIN.x),
    cm2m(z0) + h / 2,
    px2m((y1 + y2) / 2 - ORIGIN.y)
  );
  m.castShadow = m.receiveShadow = !material.transparent;
  group.add(m);
  if (collide) solids.push([Math.min(x1, x2), Math.min(y1, y2), Math.max(x1, x2), Math.max(y1, y2)]);
  return m;
}
const wall = (r, m) => box(...r, 0, CEIL_H, m, { collide: true });
const door = (r, m) => box(...r, DOOR_H, CEIL_H, m);           // 門洞上方門楣
const winAlu = new THREE.MeshStandardMaterial({ color: 0x1c1c1e, roughness: 0.4, metalness: 0.5 });   // 黑色鋁框（同 DW1）
const win = (r, m, sill = SILL_H, { top = WIN_TOP, frame = true } = {}) => {   // 窗：窗台 + 玻璃 + 窗楣（+ 鋁框）
  if (sill > 0) box(...r, 0, sill, m, { collide: true });
  else solids.push(r);
  box(...r, sill, top, mat.glass);
  box(...r, top, CEIL_H, m);
  if (!frame) return;
  // 窗型（依窗型圖）：下段 FIX 固定窗 sill ~ sill+60；上段兩扇橫拉窗（中間對開）到窗頂；外框 / 橫料 / 中間搭接立料寬 4cm、深 6cm
  const alongY = r[3] - r[1] > r[2] - r[0];
  const [a1, a2] = alongY ? [r[1], r[3]] : [r[0], r[2]];
  const c = alongY ? (r[0] + r[2]) / 2 : (r[1] + r[3]) / 2, d = 3 / CM_PER_PX, F = 4 / CM_PER_PX;   // cm2px 在後面才定義，這裡直接換算
  const seg = (b1, b2, z0, z1) => alongY ? box(c - d, b1, c + d, b2, z0, z1, winAlu) : box(b1, c - d, b2, c + d, z0, z1, winAlu);
  const zt = sill + WIN_FIX, mid = (a1 + a2) / 2;
  seg(a1, a1 + F, sill, top); seg(a2 - F, a2, sill, top);        // 左右立框
  seg(a1, a2, sill, sill + 4); seg(a1, a2, top - 4, top);          // 下框、上框
  seg(a1, a2, zt - 2, zt + 2);                                     // FIX 與橫拉窗之間的橫料
  seg(mid - F, mid + F, zt + 2, top - 4);                          // 兩扇橫拉窗中間搭接立料
};

// ---------- 地板 / 天花板 ----------
const floorRects = [
  [23, 207, 927, 541],   // 上半部（玄關、客餐廳、廚房、後陽台側房）
  [400, 527, 973, 1080], // 下半部（浴室、走道、房間）
];
floorRects.forEach(r => box(...r, -5, 0, woodFloorMaterial(r)));
box(415, 537, 557, 770, 0, 1, mat.tile);      // 浴室地坪
box(920, 268, 985, 480, -5, 0, mat.tile);     // 冷氣機平台

const ceilingGroup = new THREE.Group();

// 可動件登記（櫃門 / 抽屜 / 上掀蓋 / 房門 / 拉門）：{ pivot, apply(k), t, open }；tick() 內補間，點擊或 E 鍵切換
const movers = [];
function mover(pivot, apply, meshes, origin) {
  const m = { pivot, apply, origin, t: 0, open: false };
  meshes.forEach(x => { x.userData.mover = m; });
  movers.push(m);
  return m;
}
// 整組搬移：build() 期間加進場景的物件與碰撞矩形收成一組，回傳 set(dxPx, dyPx) 把整組平移到指定偏移
function capture(build) {
  const n = scene.children.length, ns = solids.length;
  build();
  const g = new THREE.Group();
  scene.children.slice(n).forEach(o => g.add(o));
  scene.add(g);
  const rects = solids.slice(ns).map(r => [r, r.slice(0, 4)]);
  return (dx, dy) => {
    g.position.set(px2m(dx), 0, px2m(dy));
    rects.forEach(([r, o]) => { r[0] = o[0] + dx; r[2] = o[2] + dx; r[1] = o[1] + dy; r[3] = o[3] + dy; });
  };
}
// 可拉出的家具（椅子 / 凳子）：build() 期間加進場景的物件收成一組，點擊後平移 (dxCm, dyCm)，碰撞矩形跟著移
// stops：多段位置（k 值，1 = 拉出 (dxCm, dyCm)、0 = 原位、負值 = 往反方向推），點擊依序切換；沒給就是原本的兩段（原位 / 拉出）
function movable(build, dxCm, dyCm, stops) {
  const n = scene.children.length, ns = solids.length;
  build();
  const g = new THREE.Group();
  scene.children.slice(n).forEach(o => g.add(o));
  scene.add(g);
  const rects = solids.slice(ns).map(r => [r, r.slice(0, 4)]);
  const dx = dxCm / CM_PER_PX, dy = dyCm / CM_PER_PX, meshes = [];
  g.traverse(o => { if (o.isMesh) meshes.push(o); });
  const m = mover(g, k => {
    g.position.set(px2m(dx * k), 0, px2m(dy * k));
    rects.forEach(([r, o]) => { r[0] = o[0] + dx * k; r[2] = o[2] + dx * k; r[1] = o[1] + dy * k; r[3] = o[3] + dy * k; });
  }, meshes);
  m.kind = 'room';                                                                    // 不受「櫃門：全開 / 全關」影響
  if (stops) { m.stops = stops; m.si = 0; m.k = 0; }
  return m;
}
// 房門：鉸鍊在 (hx, hy)，closedDeg / openDeg 為關門、全開時門片方向（0 = 朝 +x，-90 = 朝 +y）
// gate：門洞矩形（px），關門時擋住通行、開門後可通過；startOpen：載入時是否開著
function doorLeaf(hx, hy, lenPx, closedDeg, openDeg, material = mat.door, { gate, startOpen = true } = {}) {
  const len = px2m(lenPx);
  const g = new THREE.Group();
  const leaf = new THREE.Mesh(new THREE.BoxGeometry(len, cm2m(DOOR_H - 2), 0.04), material);
  leaf.position.set(len / 2, cm2m(DOOR_H) / 2, 0);
  leaf.castShadow = true;
  g.add(leaf);
  g.position.set(px2m(hx - ORIGIN.x), 0, px2m(hy - ORIGIN.y));
  scene.add(g);
  const a0 = THREE.MathUtils.degToRad(closedDeg), a1 = THREE.MathUtils.degToRad(openDeg);
  const m = mover(g, k => { g.rotation.y = a0 + (a1 - a0) * k; }, [leaf]);
  m.kind = 'room';
  g.userData.mover = m;                              // 之後掛上去的把手、門鎖等子物件也能點
  if (startOpen) { m.open = true; m.t = 1; }
  m.apply(m.t);
  if (gate) solids.push(Object.assign(gate, { gate: m }));
  return g;
}

//   greige   ：客廳（玄關櫃、電視牆、展示櫃）與主臥衣櫃的門片 —— 霧面暖灰

//   paleGrain：主臥入口收納櫃、次臥全部櫃體、臥室櫃內 —— 洗白木直紋
function makeGrainTexture(base, line, { n = 150, alpha = 0.16 } = {}) {
  const c = document.createElement('canvas');
  c.width = c.height = 512;
  const g = c.getContext('2d');
  g.fillStyle = base; g.fillRect(0, 0, 512, 512);
  for (let k = 0; k < n; k++) {                                   // 直向細木紋：寬窄、深淺不一，略帶彎曲
    g.strokeStyle = `rgba(${line},${(0.25 + Math.random() * 0.75) * alpha})`;
    g.lineWidth = 0.6 + Math.random() * 2.2;
    const x0 = Math.random() * 512, amp = Math.random() * 2.5, ph = Math.random() * 6;
    g.beginPath(); g.moveTo(x0, 0);
    for (let y = 0; y <= 512; y += 32) g.lineTo(x0 + Math.sin(y / 90 + ph) * amp, y);
    g.stroke();
  }
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 4;
  return t;
}

// 淺色清水模紋（廚具門板實際花色）：底色 + 大塊雲狀明暗 + 細刷痕 + 小氣孔
function makeConcreteTexture() {
  const S = 512;
  const c = document.createElement('canvas');
  c.width = c.height = S;
  const g = c.getContext('2d');
  g.fillStyle = '#e2e1dd';
  g.fillRect(0, 0, S, S);
  const blot = (n, rMin, rMax, light, aMax) => {
    for (let i = 0; i < n; i++) {
      const x = Math.random() * S, y = Math.random() * S;
      const r = rMin + Math.random() * (rMax - rMin);
      const a = Math.random() * aMax;
      const grd = g.createRadialGradient(x, y, 0, x, y, r);
      const rgb = light ? '245,245,242' : '150,148,142';
      grd.addColorStop(0, `rgba(${rgb},${a})`);
      grd.addColorStop(1, `rgba(${rgb},0)`);   // 同色透明，避免漸層邊緣帶出灰黑
      g.fillStyle = grd;
      g.fillRect(x - r, y - r, r * 2, r * 2);
    }
  };
  blot(40, 60, 180, true, 0.35);
  blot(35, 40, 140, false, 0.07);
  blot(120, 6, 30, false, 0.05);
  for (let i = 0; i < 260; i++) {          // 刷痕
    g.strokeStyle = `rgba(${Math.random() < 0.5 ? '120,118,112' : '250,250,248'},${Math.random() * 0.08})`;
    g.lineWidth = 0.5 + Math.random() * 1.5;
    const x = Math.random() * S, y = Math.random() * S, len = 10 + Math.random() * 60;
    g.beginPath(); g.moveTo(x, y); g.lineTo(x + len, y + (Math.random() - 0.5) * 6); g.stroke();
  }
  for (let i = 0; i < 400; i++) {          // 氣孔
    g.fillStyle = `rgba(110,108,102,${0.15 + Math.random() * 0.25})`;
    g.beginPath(); g.arc(Math.random() * S, Math.random() * S, Math.random() * 1.4, 0, Math.PI * 2); g.fill();
  }
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

function hingeDoor(x1, y1, x2, y2, z0, z1, material, { hinge = 'min', out = 1, angle = 85, group = scene } = {}) {
  const alongX = Math.abs(x2 - x1) > Math.abs(y2 - y1);
  const h = alongX ? (hinge === 'min' ? Math.min(x1, x2) : Math.max(x1, x2)) : (hinge === 'min' ? Math.min(y1, y2) : Math.max(y1, y2));

function glassDoors(x1, x2, depthCm, z0, z1, n, group) {
  const F = 2, w = (x2 - x1) / n, gap = cm2px(0.3);

    box(a + cm2px(F), fy(depthCm + 0.8), b - cm2px(F), fy(depthCm + 1.3), z0 + F, z1 - F, showcase.glass, { group });

// 效能：每盞即時光源都要逐像素計算，燈具模型照實擺，但實際光源以「每組一盞」合併模擬（共 9 盞 SpotLight）。

const WARM = 0xffd9a8, NEUTRAL = 0xfff1e0;
const P = (x, y, zCm) => new THREE.Vector3(px2m(x - ORIGIN.x), cm2m(zCm), px2m(y - ORIGIN.y));

// 實際光度：每盞（或每組合併）燈以光通量 lm 指定，換算成聚光燈的光強 cd = lm / 有效立體角。
// 有效立體角對 three.js 聚光燈的邊緣衰減（penumbra 0.6）做積分，確保整個光錐的總光通量等於 lm。
// 假設的燈具規格（一般市售 LED）：崁燈一律 7.5cm 開孔、8W ≈ 720 lm、泛光型（光束角約 90~100°）、AR111 燈頭 9W ≈ 700 lm、
// 軌道投射燈 7W ≈ 600 lm、餐桌吊燈 20W ≈ 1800 lm、燈條 10W/m ≈ 800 lm/m。換燈具時改各處的 lm 即可。
const SPOT_PENUMBRA = 0.6;
// 7.5cm 崁燈實際光束角約 60°（半照度角），每盞獨立光源：靠牆的燈會在牆上打出扇形光斑
const DL_BEAM = 60;
// 崁燈光圈邊緣：邊緣衰減拉滿（penumbra 1）、外緣放寬到 78°，半照度角仍約 60°，牆上光斑邊界變柔（總光通量由 coneSr 換算維持不變）
const DL_PENUMBRA = 1, DL_OUTER = 78;
const ROOM_LM = {};                                    // 各房間燈具總光通量（估算間接光用）
function coneSr(angleDeg, penumbra = SPOT_PENUMBRA) {
  const a = THREE.MathUtils.degToRad(angleDeg / 2), c0 = Math.cos(a), c1 = Math.cos(a * (1 - penumbra)), N = 240;
  let sum = 0;
  for (let i = 0; i < N; i++) { const t = (i + 0.5) / N * a; sum += THREE.MathUtils.smoothstep(Math.cos(t), c0, c1) * Math.sin(t) * (a / N); }
  return 2 * Math.PI * sum;
}
// q：畫質分級光源。'hi' = 只在「畫質：高」出現（每盞崁燈獨立 + 地板反射光）；'lo' = 只在「標準」出現（同一組崁燈合併成一顆寬角光源，省效能）
const QUALITY_LIGHTS = [];
function spot(from, to, { color = WARM, lm = 600, angle = 30, distance = 7, room, q } = {}) {
  const dl = angle === DL_BEAM, pen = dl ? DL_PENUMBRA : SPOT_PENUMBRA, outer = dl ? DL_OUTER : angle;
  const l = new THREE.SpotLight(color, lm / coneSr(outer, pen), distance * 1.3, THREE.MathUtils.degToRad(outer / 2), pen, 2);
  l.userData.lm = lm;
  if (room && q !== 'lo') ROOM_LM[room] = (ROOM_LM[room] || 0) + lm;
  if (q) { l.userData.q = q; QUALITY_LIGHTS.push(l); }
  l.position.copy(from);
  l.target.position.copy(to);
  scene.add(l, l.target);
  return l;
}
function lampHead(pos, target, rCm, lenCm, bodyMat) {     // 圓筒燈頭，+Z 軸朝向照射目標
  const g = new THREE.Group();
  const geo = new THREE.CylinderGeometry(cm2m(rCm), cm2m(rCm), cm2m(lenCm), 24);
  geo.rotateX(Math.PI / 2);
  g.add(new THREE.Mesh(geo, bodyMat));
  const lens = new THREE.Mesh(new THREE.CircleGeometry(cm2m(rCm * 0.8), 24), fixtureMat.lamp);
  lens.position.z = cm2m(lenCm / 2 + 0.1);
  g.add(lens);
  g.position.copy(pos);
  g.lookAt(target);
  scene.add(g);
}

// 全嵌式洗碗機（BOSCH SMV4HAX00X：60 寬 / 81.5 高 / 55 深，13 人份）：外觀是跟旁邊一樣的櫃門片，門往下翻開 → 不鏽鋼內膽、下籃 / 上籃、餐具籃、噴臂，門頂緣有隱藏式操作面板
// 本地座標（cm）：u = 沿門寬（0~60），v = 從櫃體前緣往內，z = 高度。(x, y) = 櫃體前緣、u = 0 那一角的平面座標，rotY = 本地 u 軸轉到世界的角度
function dishwasher(x, y, rotY, panel, { depth = 58 } = {}) {
  const root = new THREE.Group();
  root.position.set(px2m(x - ORIGIN.x), 0, px2m(y - ORIGIN.y));
  root.rotation.y = rotY;
  scene.add(root);
  const steel = new THREE.MeshStandardMaterial({ color: 0xc6cacd, roughness: 0.32, metalness: 0.55 });
  const dark = new THREE.MeshStandardMaterial({ color: 0x2e3135, roughness: 0.45 });
  const L = (u1, u2, v1, v2, z0, z1, m, parent = root, p = [0, 0, 0]) => {
    const g = new THREE.Mesh(new THREE.BoxGeometry(cm2m(u2 - u1), cm2m(z1 - z0), cm2m(v2 - v1)), m);
    g.position.set(cm2m((u1 + u2) / 2 - p[0]), cm2m((z0 + z1) / 2 - p[1]), -cm2m((v1 + v2) / 2 - p[2]));
    g.castShadow = g.receiveShadow = true;
    parent.add(g);
    return g;
  };
  // 鐵線籃：透明貼圖格網（alphaTest），不投影
  const wireTex = (cols, rows) => {
    const c = document.createElement('canvas'); c.width = c.height = 256;
    const g = c.getContext('2d'); g.strokeStyle = '#d4d7db'; g.lineWidth = 5;
    for (let i = 0; i <= cols; i++) { const p = 2.5 + i * 251 / cols; g.beginPath(); g.moveTo(p, 0); g.lineTo(p, 256); g.stroke(); }
    for (let i = 0; i <= rows; i++) { const p = 2.5 + i * 251 / rows; g.beginPath(); g.moveTo(0, p); g.lineTo(256, p); g.stroke(); }
    const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4;
    return new THREE.MeshStandardMaterial({ map: t, alphaTest: 0.5, side: THREE.DoubleSide, roughness: 0.5 });
  };
  const W = (u1, u2, v1, v2, z0, z1, cell = 3, tines = false) => {      // 一片鐵網（u / v / z 其中一軸為 0 厚）
    const du = u2 - u1, dv = v2 - v1, dz = z1 - z0;
    let a, b, geo, m;
    if (dz === 0) { a = du; b = dv; geo = new THREE.PlaneGeometry(cm2m(du), cm2m(dv)); geo.rotateX(-Math.PI / 2); }
    else if (dv === 0) { a = du; b = dz; geo = new THREE.PlaneGeometry(cm2m(du), cm2m(dz)); }

function softBox(x1, y1, x2, y2, z0, z1, rCm, material, { collide = false } = {}) {

  cyl(LX + s * cm2px(3), LY, 11, 0, 0.8, rubber);                                         // 底座止滑墊
  cyl(LX + s * cm2px(3), LY, 12, 0.8, 2.8, nickel);                                       // 圓底座 Ø24

  box(Math.min(LX, X2) - cm2px(1), LY - cm2px(2.5), Math.max(LX, X2) + cm2px(1), LY + cm2px(2.5), 74, 88, nickel); // 開關 / 調光座

  cyl(ARM - s * cm2px(2), LY, 5, 106, 108.5, nickel);                                     // 閱讀燈頭 Ø10

  const up = new THREE.Mesh(new THREE.CircleGeometry(cm2m(11.5), 32).rotateX(-Math.PI / 2), glowUp);

// ---------- 主臥：宜得利懶骨頭沙發（卡其色，約 Ø70 x 高 45cm）----------
// 放在床東側、MODO 收納櫃前與柱子包板之間的地板（x 816~917 的空地）；軟塌的豆袋外型：底部壓平、頂面凹陷、略往後靠
bagMove = capture(() => {
  const bx = 866, by = 905, R = 0.36, H = 0.45;
  const geo = new THREE.SphereGeometry(1, 48, 32);
  const p = geo.attributes.position, v = new THREE.Vector3();
  for (let i = 0; i < p.count; i++) {
    v.fromBufferAttribute(p, i);
    let y = v.y;
    const sag = 1 + 0.12 * Math.max(0, -y);                                                // 下半部往外鼓
    let x = v.x * sag, z = v.z * sag;
    if (y < -0.55) y = -0.55 - (y + 0.55) * 0.08;                                            // 底部壓平貼地
    const r = Math.hypot(v.x, v.z);
    if (y > 0.3) y -= 0.35 * Math.max(0, 1 - r * 1.6) * (y - 0.3) * 2.2;                    // 頂面坐出凹陷
    if (v.z > 0 && y > 0) y += 0.25 * v.z * y;                                               // 背側（東）略高，像靠背
    y += 0.03 * Math.sin(v.x * 9 + v.z * 7);                                                 // 布面皺褶
    p.setXYZ(i, x, y, z);
  }
  geo.computeBoundingBox();
  const bb = geo.boundingBox;
  geo.translate(0, -bb.min.y, 0);
  geo.scale(R, H / (bb.max.y - bb.min.y), R);
  geo.rotateY(-Math.PI / 2);                                                                 // 靠背朝東牆
  geo.computeVertexNormals();
  const bag = new THREE.Mesh(geo, fabric(0xa99f86));   // 卡其（偏灰，暖光下不偏橘）
  bag.position.set(px2m(bx - ORIGIN.x), 0, px2m(by - ORIGIN.y));
  bag.castShadow = bag.receiveShadow = true;
  scene.add(bag);
  solids.push(Object.assign([bx - cm2px(34), by - cm2px(34), bx + cm2px(34), by + cm2px(34)], { seat: true, top: 32 }));
});

// ---------- 浴室（依現場照片）----------
// 配置（由門口往內看）：正前方西牆靠北 = 壁掛浴櫃 + 檯面盆 + 鏡櫃；其南側 = 馬桶（背靠西牆）；

{

  const makeTile = (base, vein, grout) => {
    const c = document.createElement('canvas');

  };

  // 馬桶：TOTO G5 一體形全自動馬桶 CES75110ATW（W 38.6 x D 72 x H 51.8，便座高 38）；背靠西牆、朝東
  //   造型：裙邊包覆的蛋形座體（上寬下窄、前緣往下內收）、後段機能部（頂 51.8，前緣斜切）、長橢圓扁平便蓋
  {

    const X0 = px2m(xb - ORIGIN.x), Z0 = px2m(yc - ORIGIN.y), W2 = cm2m(19.3);
    // 平面輪廓（u：由牆往前 0~L，v：左右 ±w）：後段直邊、前段半橢圓
    const plan = (L, w, straight) => {
      const sh = new THREE.Shape();

      const g = new THREE.ExtrudeGeometry(sh, { depth: cm2m(36), bevelEnabled: true, bevelThickness: 0.012, bevelSize: 0.012, bevelSegments: 4, curveSegments: 16 });

    bowl.position.set(X0 + cm2m(37), cm2m(38.05), Z0); scene.add(bowl);

    { const hole = new THREE.Path(), a = cm2m(13), L = cm2m(27), w = cm2m(13), st = cm2m(8);

// 點桌面（或準星對準按 E）切換坐姿 72cm / 站姿 110cm；吊櫃開放格底 173cm，站姿桌面上方仍有約 63cm

const BOUNCE = 0.35;
let roomLuxBase = [], roomLuxUniform = null;
ROOMS.forEach(r => {

{

    const e = 0.003;                                                             // 只留 3mm 浮點誤差容許（交界線上的像素不會兩邊都落空、變成暗點）
    rects.push(new THREE.Vector4(px2m(x1 - ORIGIN.x) - e, px2m(y1 - ORIGIN.y) - e, px2m(x2 - ORIGIN.x) + e, px2m(y2 - ORIGIN.y) + e));
    lux.push(r.indirect);
  }));

  roomLuxBase = lux.slice(); roomLuxUniform = uniforms.uRoomLux;
  const N = rects.length;
  const decl = `uniform vec4 uRoomRect[${N}]; uniform float uRoomLux[${N}]; uniform float uRoomDefault;
    float roomLux(vec2 p) { for (int i = 0; i < ${N}; i++) { vec4 r = uRoomRect[i]; if (p.x >= r.x && p.x <= r.z && p.y >= r.y && p.y <= r.w) return uRoomLux[i]; } return uRoomDefault; }`;
  const patched = new Set();
  scene.traverse(o => {
    const m = o.material;
    if (!m || !m.isMeshStandardMaterial || patched.has(m)) return;
    patched.add(m);
    m.onBeforeCompile = (sh) => {

      sh.fragmentShader = sh.fragmentShader.replace('#include <common>', 'varying vec3 vRoomPos;\nvarying vec3 vRoomN;\n' + decl + '\n#include <common>')

    };
    m.customProgramCacheKey = () => 'roomLux';
    m.needsUpdate = true;
  });
}

const keys = {};
addEventListener('keydown', (e) => {
  if (e.code === 'Tab') { e.preventDefault(); setMode(mode === 'walk' ? 'orbit' : 'walk'); return; }
  if (e.code === 'KeyC' && !e.repeat) setPosture((posture + 1) % POSTURES.length);
  if ((e.code === 'KeyE' || e.code === 'KeyF') && !e.repeat && mode === 'walk' && walk.isLocked) interact(CENTER, 3.2);
  if (e.code === 'Space') {                       // 跳：起跳速度 3.5 m/s、重力 9.8 → 約跳高 62cm；擋掉空白鍵觸發最後點過的按鈕
    e.preventDefault();
    if (!e.repeat && mode === 'walk' && walk.isLocked && jumpV === 0) jumpV = 3.5;   // 站在地上或家具上時才能起跳（起跳 3.5 m/s → 跳高約 62cm）
  }
  keys[e.code] = true;
});
addEventListener('keyup', (e) => { keys[e.code] = false; });

// 腳下地面高度（m）：玩家中心落在有 top（cm）的矮家具上、且頂面不高於目前腳高 + 5cm 時，就站在它上面
function groundAt(xm, zm) {
  const x = xm * 100 / CM_PER_PX + ORIGIN.x, y = zm * 100 / CM_PER_PX + ORIGIN.y;
  let g = 0;
  for (const s of solids) {
    if (s.top === undefined || s.top / 100 > jumpY + 0.05) continue;
    if (x >= s[0] && x <= s[2] && y >= s[1] && y <= s[3]) g = Math.max(g, s.top / 100);
  }
  return g;
}
// 2D 圓形 vs 矩形碰撞（px 座標）
const RADIUS_PX = 20;
function blocked(xm, zm) {
  const x = xm * 100 / CM_PER_PX + ORIGIN.x;
  const y = zm * 100 / CM_PER_PX + ORIGIN.y;
  return solids.some((s) => {
    if (posture !== 0 && s.seat) return false;
    if (s.gate && s.gate.open) return false;
    if (s.top !== undefined && jumpY >= s.top / 100 - 0.02) return false;   // 有高度的矮家具：腳高過它的頂面就能越過 / 站上去        // 房門 / 拉門開著時可通過      // 坐下 / 蹲下 / 躺下時可進入沙發、椅子、床、架高地板
    const [x1, y1, x2, y2] = s;
    const cx = Math.max(x1, Math.min(x, x2));
    const cy = Math.max(y1, Math.min(y, y2));
    return (x - cx) ** 2 + (y - cy) ** 2 < RADIUS_PX ** 2;
  });
}

const clock = new THREE.Clock();
// 動態解析度：每秒檢查一次平均幀率，低於 40fps 就降低渲染解析度（最低 0.6 倍），高於 55fps 再慢慢調回上限，維持操作順暢
const PR_MAX = renderer.getPixelRatio();
let frameAcc = 0, frameN = 0;
function adaptRes(rawDt) {
  frameAcc += rawDt; frameN++;
  if (frameAcc < 1) return;
  const fps = frameN / frameAcc; frameAcc = 0; frameN = 0;
  const pr = renderer.getPixelRatio();
  let next = pr;
  if (fps < 40) next = Math.max(0.6, pr - 0.15);
  else if (fps > 55) next = Math.min(PR_MAX, pr + 0.1);
  if (Math.abs(next - pr) > 0.01) { renderer.setPixelRatio(next); fitCanvas(); }
}
let jumpY = 0, jumpV = 0, eyeY = EYE;              // 腳底離地高度（m，站在家具上 > 0）/ 垂直速度（m/s）/ 目前姿勢眼高（平滑過渡）
let hoverT = 0;
const fwd = new THREE.Vector3(), right = new THREE.Vector3();
function tick() {
  const rawDt = clock.getDelta(), dt = Math.min(rawDt, 0.05);
  adaptRes(rawDt);
  // 櫃門 / 抽屜補間
  let moving = false;
  movers.forEach(m => {
    if (m.stops) {                                                                    // 多段：直接在 k 值之間等速移動
      const target = m.stops[m.si];
      if (m.k === target) return;
      const step = dt * 2.4;
      m.k = target > m.k ? Math.min(target, m.k + step) : Math.max(target, m.k - step);
      m.apply(m.k);
      moving = true;
      return;
    }
    const target = m.open ? 1 : 0;
    if (m.t === target) return;
    m.t = target > m.t ? Math.min(1, m.t + dt * 2.4) : Math.max(0, m.t - dt * 2.4);
    m.apply(m.t * m.t * (3 - 2 * m.t));
    moving = true;
  });
  if (moving) renderer.shadowMap.needsUpdate = true;
  updateLux(dt);
  if (mode === 'walk' && (walk.isLocked || IS_TOUCH)) {
    const speed = (keys.ShiftLeft || keys.ShiftRight ? 3.2 : 1.6) * dt;
    camera.getWorldDirection(fwd);
    fwd.y = 0; fwd.normalize();
    right.crossVectors(fwd, camera.up).normalize();
    const mv = new THREE.Vector3();
    if (keys.KeyW) mv.add(fwd);
    if (keys.KeyS) mv.sub(fwd);
    if (keys.KeyD) mv.add(right);
    if (keys.KeyA) mv.sub(right);
    if (joy.active) { mv.addScaledVector(fwd, -joy.y); mv.addScaledVector(right, joy.x); }   // 觸控搖桿
    if (mv.lengthSq() > 0) {
      mv.normalize().multiplyScalar(speed * (joy.active ? Math.min(1, Math.hypot(joy.x, joy.y)) : 1));   // 搖桿推越遠走越快
      const p = camera.position;
      const stuck = blocked(p.x, p.z);              // 已卡在物件內時放行，避免完全無法移動
      if (stuck || !blocked(p.x + mv.x, p.z)) p.x += mv.x;   // 分軸移動，可沿牆滑行
      if (stuck || !blocked(p.x, p.z + mv.z)) p.z += mv.z;
    }
    eyeY += (POSTURES[posture].eye - eyeY) * Math.min(1, dt * 8);
    const ground = groundAt(camera.position.x, camera.position.z);
    if (jumpV !== 0 || jumpY > ground) { jumpV -= 9.8 * dt; jumpY += jumpV * dt; if (jumpY <= ground) { jumpY = ground; jumpV = 0; } }   // 跳躍 / 從家具上走下去會掉下來
    else jumpY = ground;
    camera.position.y = eyeY + jumpY;
    // 準星對到可開關的櫃門時變色提示
    hoverT += dt;
    if (hoverT > 0.15) {                             // 準星對到可開關的東西：準星變黃，手機的「開關」鍵也亮起
      hoverT = 0;
      const target = pick(CENTER, IS_TOUCH ? 3.5 : 3.2);
      cross.style.background = target ? '#ffd24a' : 'rgba(255,255,255,.7)';
      if (IS_TOUCH) btnUse.classList.toggle('ready', !!target);
    }
  }
  if (orbit.enabled) orbit.update();
  ruler.update(mode === 'walk' ? CENTER : mouseNdc, rawDt || 0.016);
  syncSelfLit();
  tape.frame(rawDt > 0.1 ? 0.1 : rawDt, mode === 'walk');
  if (aoOn) composer.render(); else renderer.render(scene, camera);
  tape.draw();                                                                        // 手和捲尺畫在最上層
  if (shotPending) {                                                     // 截圖：剛畫完這一幀就讀畫布（不用開 preserveDrawingBuffer）
    shotPending = false;
    renderer.domElement.toBlob(b => {
      const d = new Date(), p = n => String(n).padStart(2, '0');
      const a = document.createElement('a');
      a.href = URL.createObjectURL(b);
      a.download = `A10-4F-${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}.png`;
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    }, 'image/png');
  }
  requestAnimationFrame(tick);
}

// 依畫布實際顯示大小調整解析度與比例（iOS Safari 轉向後 innerWidth / innerHeight 會延遲更新，所以轉向後再補算一次）
function fitCanvas() {
  const c = renderer.domElement, w = c.clientWidth || innerWidth, h = c.clientHeight || innerHeight;
  camera.aspect = w / h;
  // 視野：水平固定約 90°（一般 FPS 遊戲的預設值），依螢幕比例換算垂直視角；直式手機螢幕最多 70°
  // （原本垂直 70° 在 16:9 螢幕上等於水平約 100°，近牆時畫面邊緣拉伸大、轉頭時容易暈）
  camera.fov = Math.min(70, THREE.MathUtils.radToDeg(2 * Math.atan(Math.tan(THREE.MathUtils.degToRad(90 / 2)) / camera.aspect)));
  camera.updateProjectionMatrix();
  renderer.setSize(w, h, false);
  try { composer.setPixelRatio(renderer.getPixelRatio()); composer.setSize(w, h); } catch (e) { /* composer 尚未建立（載入初期） */ }
}
addEventListener('resize', fitCanvas);
addEventListener('orientationchange', () => { setTimeout(fitCanvas, 150); setTimeout(fitCanvas, 600); });
if (window.visualViewport) visualViewport.addEventListener('resize', fitCanvas);
fitCanvas();

updateUI();
tick();
</script>
</body>
</html>
