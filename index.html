<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
<title>平面圖 3D 模型</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1b1d22; font-family: system-ui, "PingFang TC", sans-serif; }
  #ui {
    position: fixed; top: calc(12px + env(safe-area-inset-top)); left: calc(12px + env(safe-area-inset-left)); z-index: 10;
    background: rgba(20, 22, 28, .85); color: #e8e8e8; padding: 12px 14px;
    border-radius: 8px; font-size: 13px; line-height: 1.7; max-width: 280px;
  }
  #ui h1 { font-size: 15px; margin: 0 0 6px; cursor: pointer; user-select: none; display: flex; justify-content: space-between; gap: 12px; }
  #ui h1 .arrow { font-size: 12px; opacity: .7; }
  #ui.collapsed h1 { margin: 0; }
  #ui.collapsed #uiBody { display: none; }
  #ui button { margin: 4px 4px 0 0; padding: 4px 10px; border: 0; border-radius: 4px; background: #3d6fd8; color: #fff; cursor: pointer; }
  #ui button.off { background: #555; }
  #ui kbd { background: #333; border-radius: 3px; padding: 0 4px; font-size: 12px; }
  .legend span { display: inline-block; width: 12px; height: 12px; vertical-align: middle; margin-right: 4px; border-radius: 2px; }
  #hint {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 18px; pointer-events: none; text-shadow: 0 0 6px #000;
  }
  #cross { position: fixed; left: 50%; top: 50%; width: 6px; height: 6px; margin: -3px; border-radius: 50%; background: rgba(255,255,255,.7); display: none; }
  /* ---------- 手機 / 平板觸控 ---------- */
  /* 畫布固定鋪滿整個螢幕（含 iPhone 瀏海 / 手勢條區域），避免橫向時出現黑邊 */
  canvas { touch-action: none; position: fixed; left: 0; top: 0; display: block; width: 100vw !important; height: 100vh !important; height: 100dvh !important; }
  #touchUI { display: none; }
  #touchUI.on { display: block; }
  #touchUI.orbit .walkOnly { display: none; }
  #joyBase { position: fixed; left: calc(22px + env(safe-area-inset-left)); bottom: calc(22px + env(safe-area-inset-bottom)); width: 124px; height: 124px; border-radius: 50%;
    background: rgba(255,255,255,.12); border: 2px solid rgba(255,255,255,.35); touch-action: none; z-index: 20; }
  #joyStick { position: absolute; left: 37px; top: 37px; width: 50px; height: 50px; border-radius: 50%; background: rgba(255,255,255,.6); pointer-events: none; }
  #touchBtns { position: fixed; right: calc(18px + env(safe-area-inset-right)); bottom: calc(26px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 12px; z-index: 20; }
  #touchBtns button.ready { background: rgba(255,210,74,.9); color: #222; border-color: #ffd24a; }
  #touchBtns button { width: 64px; height: 64px; border-radius: 50%; border: 2px solid rgba(255,255,255,.4); background: rgba(20,22,28,.6);
    color: #fff; font-size: 15px; font-family: inherit; touch-action: manipulation; }
  @media (max-width: 640px) {
    #ui.collapsed { padding: 8px 12px; }
    #ui.collapsed h1 .arrow::after { content: ' 選單'; font-size: 12px; }
    #ui { font-size: 12px; line-height: 1.6; max-width: calc(100vw - 110px); padding: 10px 12px; }
    #ui h1 { font-size: 14px; }
    #ui button { padding: 6px 10px; }
  }
</style>
</head>
<body>
<div id="ui">
  <h1 id="uiToggle" title="點擊收合 / 展開">平面圖 3D 模型<span class="arrow">▾</span></h1>
  <div id="uiBody">
  <div id="modeText"></div>
  <div id="luxText" style="margin:2px 0 4px;color:#ffd98a"></div>
  <div>
    <button id="btnMode">切換：俯瞰模式</button>
    <button id="btnCeil">天花板：開</button>
    <button id="btnLabel" class="off" style="display:none">樑標籤：關</button>
    <button id="btnShowcase">展示櫃：方案 1</button>
    <button id="btnBeam" style="display:none">主臥樑：A 直角</button>
    <button id="btnDoors" class="off">櫃門：全關</button>
    <button id="btnBright">曝光：標準</button>
    <button id="btnWood">臥室櫃色：橡木</button>
    <button id="btnLamp">立燈：開</button>
  </div>
  <div id="postures" style="margin-top:6px">視角（身高 172cm）：<br>
    <button data-p="0">站立</button><button data-p="1" class="off">坐下</button><button data-p="2" class="off">蹲下</button><button data-p="3" class="off">躺下</button>
  </div>
  <div class="legend" style="display:none">
    <div><span style="background:#ffffff"></span>RC 牆／柱</div>
    <div><span style="background:#ffffff"></span>輕隔間</div>
    <div><span style="background:#ffffff"></span>浴室灌漿隔間</div>
    <div><span style="background:#ffffff"></span>包樑降板（G/B/J）</div>
  </div>
  </div>
</div>
<script>
  // 操作面板收合：點標題切換，狀態記在 localStorage
  (() => {
    const ui = document.getElementById('ui'), arrow = ui.querySelector('.arrow');
    const set = (c) => { ui.classList.toggle('collapsed', c); arrow.textContent = c ? '▸' : '▾'; localStorage.setItem('uiCollapsed', c ? '1' : ''); };
    const saved = localStorage.getItem('uiCollapsed');
    set(saved === null ? matchMedia('(pointer: coarse)').matches : saved === '1');   // 手機第一次開啟時預設收合
    document.getElementById('uiToggle').addEventListener('click', () => set(!ui.classList.contains('collapsed')));
  })();
</script>
<div id="hint">點擊畫面進入室內漫遊</div>
<div id="cross"></div>
<div id="touchUI">
  <div id="joyBase" class="walkOnly"><div id="joyStick"></div></div>
  <div id="touchBtns" class="walkOnly"><button id="btnUse">開關</button><button id="btnJump">跳</button><button id="btnPosture">站</button></div>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RectAreaLightUniformsLib } from 'three/addons/lights/RectAreaLightUniformsLib.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

// 觸控裝置（手機 / 平板）：改用虛擬搖桿 + 拖曳轉視角，解析度上限降低以維持流暢
const IS_TOUCH = matchMedia('(pointer: coarse)').matches || 'ontouchstart' in window;

// ---------- 比例與高度設定 ----------
// 由圖上尺寸線換算：底部 140+10+90+260+35 cm 約佔 548px，約 1 px ≈ 0.98 cm
const CM_PER_PX = 0.98;
const CEIL_H = 320;   // 樓板下淨高（cm），使用者提供
const SLAB = 15;      // 樓板厚（cm），樑深扣掉樓板即為樑下垂量
const DOOR_H = 210;   // 門高
const SILL_H = 60;    // 窗台高（A10 全室低台度窗，離地 60）
const WIN_TOP = 230;  // 窗頂高（依窗型圖：窗台 60 + 下段固定窗 60 + 上段橫拉窗 110）
const WIN_FIX = 60;   // 下段固定窗（FIX）高
const ORIGIN = { x: 500, y: 640 }; // 平面圖中心（px）

const px2m = (p) => p * CM_PER_PX / 100;
const cm2m = (c) => c / 100;

// ---------- 場景 ----------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, IS_TOUCH ? 1.25 : 1.5));   // 逐像素光照成本與像素數成正比，Retina 2x 會慢約 4 倍
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.toneMapping = THREE.ACESFilmicToneMapping;   // 讓燈光亮處自然收斂，不會過曝成一片白
renderer.toneMappingExposure = 1.1 / 118;   // 實際單位：光源用 cd / lx / nit，曝光把「白牆 200 lx」對到舒適的畫面亮度（見 EXPOSURES）
renderer.shadowMap.type = THREE.BasicShadowMap;   // 陰影主要用來讓牆擋住房間補光（避免漏光），硬邊即可；柔邊 PCF 取樣成本約讓 FPS 減半
// 場景靜態：陰影只在載入與切換顯示（展示櫃、天花板）時重算，不必每幀更新
renderer.shadowMap.autoUpdate = false;
renderer.shadowMap.needsUpdate = true;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1b1d22);

const camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.05, 200);

// 環境光 = 各房間的間接光（燈光在牆面、天花之間來回反射後的照度，lx）。
// HemisphereLight 強度固定為 1，實際數值由材質 shader 依所在房間乘上該房間的間接照度（見檔案末「實際照度」段）。
const ambient = new THREE.HemisphereLight(0xfff0dc, 0xd9cfc0, 1);
// 朝下的面（天花、樑底、降板底）額外 +40%：崁燈的直射光多半落在地板，地板再往上反射，實際天花比「平均間接光」亮，
// 不加的話天花、樑底、凹處會整片偏灰
ambient.groundColor.setRGB(1.4 * 0.851, 1.4 * 0.812, 1.4 * 0.753);
scene.add(ambient);
// 曝光 = 眼睛 / 相機的適應程度；標準值讓 200 lx 下的白牆呈現舒適亮度
const EXPOSURES = [{ name: '標準', k: 1 }, { name: '+1 EV（眼睛適應暗處）', k: 2 }, { name: '-1 EV', k: 0.5 }];
const SUN_LX = 250;                                   // 俯瞰模式（天花板關閉）用的平行補光；天花板開啟時關掉，室內只剩燈具
const sun = new THREE.DirectionalLight(0xffffff, 0);
sun.position.set(6, 12, 4);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -8, right: 8, top: 8, bottom: -8 });
scene.add(sun);

// ---------- 材質 ----------
// 超耐磨木地板：Order floor 赫卡奇柏橡-窄版 Khaki Oak 5966（單片 19.5 x 128.8cm，交錯貼）
// canvas 程序產生，一張貼圖 = 2 片長 x 8 排寬 = 257.6cm x 156cm；每排端縫位置不同（交錯、錯開至少約 30cm，不做規則的 1/2 錯縫）
const WOOD_TILE = { w: 2.576, d: 1.56 };
function makeWoodTexture() {
  const c = document.createElement('canvas');
  const ROWS = 8, PL = 128.8;                                     // 排數、單片長（cm）
  c.width = 2048; c.height = Math.round(2048 * 156 / 257.6);
  const ctx = c.getContext('2d');
  const plankH = c.height / ROWS, pxPerCm = c.width / 257.6;
  const tones = ['#c4ae94', '#b9a389', '#cab59c', '#bfa98f', '#b39d85', '#c6b299', '#bba68f'];   // 卡其灰調淺橡木（取自產品照片）
  const offs = [0, 0.38, 0.77, 0.21, 0.6, 0.93, 0.47, 0.13];      // 各排端縫起點（單片長的比例），相鄰排錯開 >= 25%
  let toneK = 0;
  for (let i = 0; i < ROWS; i++) {
    const y = i * plankH, plankW = PL * pxPerCm;
    for (let x0 = offs[i] * plankW - plankW; x0 < c.width; x0 += plankW) {
      const tone = tones[(toneK++ * 3 + i) % tones.length];
      const draw = (sx) => {
        ctx.save(); ctx.beginPath(); ctx.rect(sx, y, plankW, plankH); ctx.clip();
        ctx.fillStyle = tone; ctx.fillRect(sx, y, plankW, plankH);
        // 長條順紋：深淺不一的細線，略帶起伏
        for (let k = 0; k < 26; k++) {
          const dark = Math.random() < 0.6;
          ctx.strokeStyle = dark ? `rgba(120,96,70,${0.05 + Math.random() * 0.12})` : `rgba(235,222,200,${0.06 + Math.random() * 0.1})`;
          ctx.lineWidth = 0.8 + Math.random() * 2.4;
          const gy = y + Math.random() * plankH, ph = Math.random() * 6, amp = 1 + Math.random() * 3;
          ctx.beginPath(); ctx.moveTo(sx, gy);
          for (let x = 0; x <= plankW; x += 48) ctx.lineTo(sx + x, gy + Math.sin(x / 140 + ph) * amp);
          ctx.stroke();
        }
        // 山紋（拉長的橢圓弧）+ 偶爾的小節點
        for (let k = 0; k < 2; k++) {
          const cx = sx + Math.random() * plankW, cy = y + plankH * (0.3 + Math.random() * 0.4);
          for (let r = 1; r <= 4; r++) {
            ctx.strokeStyle = `rgba(110,86,60,${0.07 + Math.random() * 0.06})`; ctx.lineWidth = 1.2;
            ctx.beginPath(); ctx.ellipse(cx, cy, 40 + r * 38, 3 + r * 4.5, 0, 0, Math.PI * 2); ctx.stroke();
          }
          if (Math.random() < 0.5) { ctx.fillStyle = 'rgba(100,76,52,.25)'; ctx.beginPath(); ctx.ellipse(cx + 30, cy, 6, 3, 0, 0, Math.PI * 2); ctx.fill(); }
        }
        ctx.restore();
        ctx.fillStyle = 'rgba(95,75,55,.35)'; ctx.fillRect(sx + plankW - 2, y, 2, plankH);   // 端縫
      };
      draw(x0);
      if (x0 + plankW > c.width) draw(x0 - c.width);              // 跨過右緣的那片，左邊補上，貼圖才能無縫重複
    }
    ctx.fillStyle = 'rgba(95,75,55,.4)'; ctx.fillRect(0, y + plankH - 2, c.width, 2);       // 長邊縫
  }
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return t;
}
const woodTexture = makeWoodTexture();

const mat = {
  rc:    new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.9 }),
  light: new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.9 }),
  wet:   new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.7 }),
  beam:  new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.9 }),
  tile:  new THREE.MeshStandardMaterial({ color: 0xf4f4f4, roughness: 0.5 }),
  ceil:  new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 1, side: THREE.DoubleSide }),
  glass: new THREE.MeshStandardMaterial({ color: 0x88c4ff, transparent: true, opacity: 0.25, roughness: 0.05 }),
  frame: new THREE.MeshStandardMaterial({ color: 0x333333 }),
  door:  new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.6 }),
  white: new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.3 }),
  cabinet: new THREE.MeshStandardMaterial({ color: 0xd3d5d8, roughness: 0.5 }),
  ac:    new THREE.MeshStandardMaterial({ color: 0xd0d0d0 }),
};

// 每塊地板依尺寸設定貼圖重複次數，讓木紋比例一致
function woodFloorMaterial(r) {
  const t = woodTexture.clone();
  t.needsUpdate = true;
  t.repeat.set(px2m(r[2] - r[0]) / WOOD_TILE.w, px2m(r[3] - r[1]) / WOOD_TILE.d);
  return new THREE.MeshStandardMaterial({ map: t, roughness: 0.75 });
}

// 平面碰撞用矩形（px 座標）
const solids = [];

// 以平面圖 px 座標 (x1,y1)-(x2,y2) 與高度區間 z0~z1 (cm) 建立方塊
function box(x1, y1, x2, y2, z0, z1, material, { collide = false, group = scene } = {}) {
  const w = px2m(Math.abs(x2 - x1)), d = px2m(Math.abs(y2 - y1)), h = cm2m(z1 - z0);
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), material);
  m.position.set(
    px2m((x1 + x2) / 2 - ORIGIN.x),
    cm2m(z0) + h / 2,
    px2m((y1 + y2) / 2 - ORIGIN.y)
  );
  m.castShadow = m.receiveShadow = !material.transparent;
  group.add(m);
  if (collide) solids.push([Math.min(x1, x2), Math.min(y1, y2), Math.max(x1, x2), Math.max(y1, y2)]);
  return m;
}
const wall = (r, m) => box(...r, 0, CEIL_H, m, { collide: true });
const door = (r, m) => box(...r, DOOR_H, CEIL_H, m);           // 門洞上方門楣
const winAlu = new THREE.MeshStandardMaterial({ color: 0x1c1c1e, roughness: 0.4, metalness: 0.5 });   // 黑色鋁框（同 DW1）
const win = (r, m, sill = SILL_H, { top = WIN_TOP, frame = true } = {}) => {   // 窗：窗台 + 玻璃 + 窗楣（+ 鋁框）
  if (sill > 0) box(...r, 0, sill, m, { collide: true });
  else solids.push(r);
  box(...r, sill, top, mat.glass);
  box(...r, top, CEIL_H, m);
  if (!frame) return;
  // 窗型（依窗型圖）：下段 FIX 固定窗 sill ~ sill+60；上段兩扇橫拉窗（中間對開）到窗頂；外框 / 橫料 / 中間搭接立料寬 4cm、深 6cm
  const alongY = r[3] - r[1] > r[2] - r[0];
  const [a1, a2] = alongY ? [r[1], r[3]] : [r[0], r[2]];
  const c = alongY ? (r[0] + r[2]) / 2 : (r[1] + r[3]) / 2, d = 3 / CM_PER_PX, F = 4 / CM_PER_PX;   // cm2px 在後面才定義，這裡直接換算
  const seg = (b1, b2, z0, z1) => alongY ? box(c - d, b1, c + d, b2, z0, z1, winAlu) : box(b1, c - d, b2, c + d, z0, z1, winAlu);
  const zt = sill + WIN_FIX, mid = (a1 + a2) / 2;
  seg(a1, a1 + F, sill, top); seg(a2 - F, a2, sill, top);        // 左右立框
  seg(a1, a2, sill, sill + 4); seg(a1, a2, top - 4, top);          // 下框、上框
  seg(a1, a2, zt - 2, zt + 2);                                     // FIX 與橫拉窗之間的橫料
  seg(mid - F, mid + F, zt + 2, top - 4);                          // 兩扇橫拉窗中間搭接立料
};

// ---------- 地板 / 天花板 ----------
const floorRects = [
  [23, 207, 927, 541],   // 上半部（玄關、客餐廳、廚房、後陽台側房）
  [400, 527, 973, 1080], // 下半部（浴室、走道、房間）
];
floorRects.forEach(r => box(...r, -5, 0, woodFloorMaterial(r)));
box(415, 537, 557, 770, 0, 1, mat.tile);      // 浴室地坪
box(920, 268, 985, 480, -5, 0, mat.tile);     // 冷氣機平台

const ceilingGroup = new THREE.Group();
scene.add(ceilingGroup);
floorRects.forEach(r => box(...r, CEIL_H, CEIL_H + SLAB, mat.ceil, { group: ceilingGroup }));
// 廚房區平釘降板：水泥紋高櫃（x 437）往內到 DW1 隔間（x 737），牆面到 J5 樑，天花下緣 245cm
// 依設計參考圖：降板與 G4 包樑下緣、廚具櫃頂齊平成一整片（G4 包樑 y 207~290 已在同一高度，降板從 y 290 接起避免重疊）
const KITCHEN_CEIL_H = CEIL_H - (90 - SLAB);
box(437, 290, 737, 541, KITCHEN_CEIL_H, CEIL_H, mat.ceil, { group: ceilingGroup });
// 走道（浴室門 / 次臥門 / 主臥入口之間，x 567~658、y 541~780）+ 主臥入口凹槽收納櫃上方（x 658~685、y 635~770）：
// 天花降到與餐廳 / 廚房同高（245），從餐廳一路切齊；走道崁燈與凹槽櫃前崁燈跟著降下
box(567, 541, 658, 780, KITCHEN_CEIL_H, CEIL_H, mat.ceil, { group: ceilingGroup });
box(658, 635, 685, 770, KITCHEN_CEIL_H, CEIL_H, mat.ceil, { group: ceilingGroup });

// ---------- RC 柱 ----------
[
  [23, 145, 145, 268],
  [851, 145, 973, 268],
  [851, 958, 973, 1080],
].forEach(r => wall(r, mat.rc));

// ---------- RC 牆 ----------
[
  [145, 207, 851, 221],   // 上方外牆
  [737, 221, 750, 268],   // 廚房端牆
  [737, 430, 750, 486],
  [737, 472, 927, 486],
  [737, 486, 750, 527],   // J5 下方牆垛
  [913, 486, 927, 505],
  [913, 657, 927, 690],
  [927, 676, 973, 690],
  [958, 690, 973, 740],
  [958, 905, 973, 958],
  [400, 1066, 455, 1080], // 下方外牆
  [618, 1066, 851, 1080],
  [400, 527, 415, 1066],  // 左側外牆
  [23, 527, 400, 541],

function makeConcreteTexture() {

  g.fillStyle = '#e2e1dd';
  g.fillRect(0, 0, S, S);
  const blot = (n, rMin, rMax, light, aMax) => {
    for (let i = 0; i < n; i++) {
      const x = Math.random() * S, y = Math.random() * S;
      const r = rMin + Math.random() * (rMax - rMin);
      const a = Math.random() * aMax;
      const grd = g.createRadialGradient(x, y, 0, x, y, r);
      const rgb = light ? '245,245,242' : '150,148,142';
      grd.addColorStop(0, `rgba(${rgb},${a})`);
      grd.addColorStop(1, `rgba(${rgb},0)`);   // 同色透明，避免漸層邊緣帶出灰黑
      g.fillStyle = grd;
      g.fillRect(x - r, y - r, r * 2, r * 2);

  };

  blot(35, 40, 140, false, 0.07);
  blot(120, 6, 30, false, 0.05);
  for (let i = 0; i < 260; i++) {          // 刷痕
    g.strokeStyle = `rgba(${Math.random() < 0.5 ? '120,118,112' : '250,250,248'},${Math.random() * 0.08})`;
    g.lineWidth = 0.5 + Math.random() * 1.5;
    const x = Math.random() * S, y = Math.random() * S, len = 10 + Math.random() * 60;
    g.beginPath(); g.moveTo(x, y); g.lineTo(x + len, y + (Math.random() - 0.5) * 6); g.stroke();

  for (let i = 0; i < 400; i++) {          // 氣孔
    g.fillStyle = `rgba(110,108,102,${0.15 + Math.random() * 0.25})`;
    g.beginPath(); g.arc(Math.random() * S, Math.random() * S, Math.random() * 1.4, 0, Math.PI * 2); g.fill();

  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

    g.fillStyle = color; g.beginPath(); g.moveTo(0, 288);
    pts.forEach(([x, y]) => g.lineTo(x, y)); g.lineTo(512, 288); g.fill();
  };
  ridge('#4c5d6e', [[0, 150], [120, 120], [220, 140], [330, 95], [430, 110], [512, 100]]);
  ridge('#4f6b3a', [[0, 190], [140, 165], [260, 185], [400, 150], [512, 170]]);
  ridge('#8a9a4c', [[0, 240], [200, 210], [360, 220], [512, 200]]);
  g.strokeStyle = '#9a9a9a'; g.lineWidth = 14;
  g.beginPath(); g.moveTo(0, 270); g.bezierCurveTo(200, 230, 330, 290, 430, 210); g.stroke();
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

function makeLabel(text) {
  const c = document.createElement('canvas');
  c.width = 256; c.height = 64;
  const ctx = c.getContext('2d');
  ctx.fillStyle = 'rgba(0,0,0,.6)';
  ctx.fillRect(0, 0, 256, 64);
  ctx.fillStyle = '#ffcf8a';
  ctx.font = 'bold 34px sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(text, 128, 32);
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(c), depthTest: false, toneMapped: false }));
  s.scale.set(0.8, 0.2, 1);
  return s;
}

// 客餐廚、主臥、次臥以外的空間（陽台、浴室、走道）尚未規劃燈具，目前只有環境光

// ---------- 燈光計畫：客廳 / 餐廳 / 廚房 ----------
// 效能：每盞即時光源都要逐像素計算，燈具模型照實擺，但實際光源以「每組一盞」合併模擬（共 9 盞 SpotLight）。
// 客廳天花 320cm（x 100~437、y 267~490，四周為 B3/G4/J5 包樑）；廚房、餐廳在 245cm 降板下（x 437~737）。
// 色溫：客餐廳 3000K 暖光，廚房工作區 4000K 偏白光。
const WARM = 0xffd9a8, NEUTRAL = 0xfff1e0;
const P = (x, y, zCm) => new THREE.Vector3(px2m(x - ORIGIN.x), cm2m(zCm), px2m(y - ORIGIN.y));
const fixtureMat = {
  white: new THREE.MeshStandardMaterial({ color: 0xf4f4f4, roughness: 0.4 }),
  black: new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.5 }),
  lamp:  new THREE.MeshBasicMaterial({ color: 0xfff4dd, toneMapped: false }),
};
// 實際光度：每盞（或每組合併）燈以光通量 lm 指定，換算成聚光燈的光強 cd = lm / 有效立體角。
// 有效立體角對 three.js 聚光燈的邊緣衰減（penumbra 0.6）做積分，確保整個光錐的總光通量等於 lm。
// 假設的燈具規格（一般市售 LED）：崁燈一律 7.5cm 開孔、8W ≈ 720 lm、泛光型（光束角約 90~100°）、AR111 燈頭 9W ≈ 700 lm、
// 軌道投射燈 7W ≈ 600 lm、餐桌線型吊燈 20W ≈ 1800 lm、燈條 10W/m ≈ 800 lm/m。換燈具時改各處的 lm 即可。
const ROOM_LM = {};                                    // 各房間燈具總光通量（估算間接光用）
function coneSr(angleDeg, penumbra = 0.6) {
  const a = THREE.MathUtils.degToRad(angleDeg / 2), c0 = Math.cos(a), c1 = Math.cos(a * (1 - penumbra)), N = 240;
  let sum = 0;
  for (let i = 0; i < N; i++) { const t = (i + 0.5) / N * a; sum += THREE.MathUtils.smoothstep(Math.cos(t), c0, c1) * Math.sin(t) * (a / N); }
  return 2 * Math.PI * sum;
}
function spot(from, to, { color = WARM, lm = 600, angle = 30, distance = 7, room } = {}) {
  const l = new THREE.SpotLight(color, lm / coneSr(angle), distance * 1.3, THREE.MathUtils.degToRad(angle / 2), 0.6, 2);
  l.userData.lm = lm;
  if (room) ROOM_LM[room] = (ROOM_LM[room] || 0) + lm;
  l.position.copy(from);
  l.target.position.copy(to);
  scene.add(l, l.target);
  return l;
}
function lampHead(pos, target, rCm, lenCm, bodyMat) {     // 圓筒燈頭，+Z 軸朝向照射目標
  const g = new THREE.Group();
  const geo = new THREE.CylinderGeometry(cm2m(rCm), cm2m(rCm), cm2m(lenCm), 24);
  geo.rotateX(Math.PI / 2);
  g.add(new THREE.Mesh(geo, bodyMat));
  const lens = new THREE.Mesh(new THREE.CircleGeometry(cm2m(rCm * 0.8), 24), fixtureMat.lamp);
  lens.position.z = cm2m(lenCm / 2 + 0.1);
  g.add(lens);
  g.position.copy(pos);
  g.lookAt(target);
  scene.add(g);
}

// 圓角方塊：x1~x2、y1~y2（平面 px）、z0~z1（cm），半徑 rCm
function softBox(x1, y1, x2, y2, z0, z1, rCm, material, { collide = false } = {}) {
  const w = px2m(x2 - x1), d = px2m(y2 - y1), h = cm2m(z1 - z0);
  const m = new THREE.Mesh(new RoundedBoxGeometry(w, h, d, 3, Math.min(cm2m(rCm), w / 2, h / 2, d / 2)), material);
  m.position.set(px2m((x1 + x2) / 2 - ORIGIN.x), cm2m(z0) + h / 2, px2m((y1 + y2) / 2 - ORIGIN.y));
  m.castShadow = m.receiveShadow = true;
  scene.add(m);
  if (collide) solids.push([x1, y1, x2, y2]);
  return m;
}

// 沙發：淺駝棕科技貓抓布，雙模組拼接 3 人座（依型錄）：總寬 212、總深 112、總高 83、
//       含扶手座位寬 106（每模組）、座高 43、腳高 4cm。靠 J5 下方牆、中心對齊電視，面向電視牆
const SOFA = { cx: tvCx, back: 527 - cm2px(2), w: 212, d: 112 };
const fabric = (hex) => new THREE.MeshStandardMaterial({ map: makeConcreteTexture(), color: hex, roughness: 0.95 }); // 斑駁紋模擬貓抓布
const camel = fabric(0xa8845f);                                                   // 型錄淺駝棕，室內暖光下會再偏暖，底色刻意降低飽和
const camelDark = fabric(0x8f7050);
{
  const yb = SOFA.back, yf = yb - cm2px(SOFA.d);
  const x0 = SOFA.cx - cm2px(SOFA.w / 2), modW = cm2px(SOFA.w / 2), seam = cm2px(0.6);
  const LEG = 4, SEAT = 43, ARM_W = 22, ARM_H = 58, BACK_D = 26, BASE_TOP = 28;
  solids.push(Object.assign([x0, yf, x0 + cm2px(SOFA.w), yb], { seat: true, top: SEAT }));   // seat：坐下 / 躺下時可進入；top：可以跳上去站
  [0, 1].forEach(i => {
    const a = x0 + i * modW + (i ? seam / 2 : 0), b = x0 + (i + 1) * modW - (i ? 0 : seam / 2);
    const armL = i === 0;                                                            // 扶手只在外側
    const sa = armL ? a + cm2px(ARM_W) : a, sb = armL ? b : b - cm2px(ARM_W);
    // 黑色短腳 x4
    [[sa + cm2px(6), yf + cm2px(8)], [sb - cm2px(10), yf + cm2px(8)], [sa + cm2px(6), yb - cm2px(12)], [sb - cm2px(10), yb - cm2px(12)]]
      .forEach(([lx, ly]) => box(lx, ly, lx + cm2px(4), ly + cm2px(4), 0, LEG, alu));
    softBox(sa, yf + cm2px(2), sb, yb, LEG, BASE_TOP, 3, camelDark);                 // 座框
    softBox(sa, yf, sb, yb - cm2px(BACK_D), BASE_TOP, SEAT, 5, camel);               // 坐墊（每模組一片）
    softBox(sa, yb - cm2px(BACK_D), sb, yb, BASE_TOP, 72, 7, camel);                 // 靠背
    const head = softBox(sa + cm2px(1), yb - cm2px(BACK_D - 2), sb - cm2px(1), yb - cm2px(2), 69, 83, 6, camel); // 可調頭枕
    head.rotation.x = -0.18;                                                          // 頭枕略往前傾
    const armX1 = armL ? a : b - cm2px(ARM_W), armX2 = armL ? a + cm2px(ARM_W) : b;
    softBox(armX1, yf, armX2, yb, LEG, ARM_H, 5, camel);                             // 寬扶手（落地至腳高）
  });
}

  // 外斜錐腳：頂部 4.5cm 方、底部 3cm，往長邊方向外斜約 7cm、短邊方向約 3cm
  [[-1, -1], [1, -1], [-1, 1], [1, 1]].forEach(([sx, sy]) => {

// 餐桌小盆栽：白色陶瓷小盆（Ø12 x 高 10）+ 圓葉綠植（類似椒草 / 小圓葉），放桌面正中央
{
  const px = DINING.x, py = DINING.y, Z = 74;                                          // 桌面正中央
  const ceramic = new THREE.MeshStandardMaterial({ color: 0xf1efea, roughness: 0.35 });
  const soil = new THREE.MeshStandardMaterial({ color: 0x3b2b1f, roughness: 1 });
  const leafMats = [0x245a22, 0x2f6b2a, 0x1c4a1c].map(c => new THREE.MeshStandardMaterial({ color: c, roughness: 0.6, side: THREE.DoubleSide }));
  const stemMat = new THREE.MeshStandardMaterial({ color: 0x5d7f3a, roughness: 0.7 });
  const pot = new THREE.Mesh(new THREE.CylinderGeometry(cm2m(6), cm2m(4.8), cm2m(10), 28), ceramic);
  const base = new THREE.Vector3(px2m(px - ORIGIN.x), cm2m(Z), px2m(py - ORIGIN.y));
  pot.position.copy(base).add(new THREE.Vector3(0, cm2m(5), 0)); pot.castShadow = true; scene.add(pot);
  const dirt = new THREE.Mesh(new THREE.CylinderGeometry(cm2m(5.6), cm2m(5.6), cm2m(0.5), 24), soil);
  dirt.position.copy(base).add(new THREE.Vector3(0, cm2m(9.3), 0)); scene.add(dirt);
  const leafGeo = new THREE.SphereGeometry(1, 12, 8); leafGeo.scale(cm2m(2.6), cm2m(0.35), cm2m(1.9));
  let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  for (let i = 0; i < 26; i++) {                                                        // 莖從盆中心往外上方伸，末端一片圓葉
    const a = rnd() * Math.PI * 2, r = cm2m(1 + rnd() * 6), h = cm2m(4 + rnd() * 9);
    const tip = base.clone().add(new THREE.Vector3(Math.cos(a) * r, cm2m(9.5) + h, Math.sin(a) * r));
    const root = base.clone().add(new THREE.Vector3(Math.cos(a) * r * 0.2, cm2m(9.5), Math.sin(a) * r * 0.2));
    const d = tip.clone().sub(root), stem = new THREE.Mesh(new THREE.CylinderGeometry(cm2m(0.15), cm2m(0.2), d.length(), 5), stemMat);
    stem.position.copy(root).add(tip).multiplyScalar(0.5); stem.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), d.normalize()); scene.add(stem);
    const leaf = new THREE.Mesh(leafGeo, leafMats[i % 3]);
    leaf.position.copy(tip); leaf.rotation.set((rnd() - 0.5) * 0.9, -a, (rnd() - 0.3) * 0.7); leaf.castShadow = true; scene.add(leaf);

// 臥室窗簾：灰色上下雙開風琴簾（Top-down / Bottom-up），裝在窗簾盒內（W5、W1 主臥；W2 次臥）
// 窗簾盒：W5、W1 上方本來就有 G2 / B5 包樑（凸出約 55cm、下緣 245cm），直接當窗簾盒，底部靠牆留 12cm 暗藏軌道槽；
//         W2 上方 B5 只凸出約 10cm，另沿次臥東牆做 15cm 深窗簾盒，下緣齊 B5 包樑 245cm
// 簾子從窗簾盒垂下（距牆 6cm），左右比窗洞各寬約 8cm（W5 西側緊鄰衣櫃吊衣格、東側緊鄰床頭牆，不外擴）
// 頂部固定上軌 + 可上下移動的中軌與下軌，示意簾布停在窗戶中段（120~180cm）
{
  const c = document.createElement('canvas');
  c.width = 64; c.height = 512;
  const g = c.getContext('2d');
  const PLEATS = 30;
  for (let i = 0; i < PLEATS; i++) {                                                       // 每褶上亮下暗，做出摺痕立體感
    const y0 = i * c.height / PLEATS, h = c.height / PLEATS;
    const grd = g.createLinearGradient(0, y0, 0, y0 + h);
    grd.addColorStop(0, '#d6d6d4'); grd.addColorStop(0.55, '#bdbdbb'); grd.addColorStop(1, '#8f8f8d');
    g.fillStyle = grd; g.fillRect(0, y0, c.width, h);
  }
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  const shadeMat = new THREE.MeshStandardMaterial({ map: tex, color: 0xdcdcda, roughness: 0.9 });   // 簾面朝室內、受光少，底色提亮才會呈現中灰
  const railMat = new THREE.MeshStandardMaterial({ color: 0xb8b8b6, roughness: 0.4 });
  const LOW = 120, HIGH = 180, T = cm2px(1.5), TOP = BEAM_BOTTOM - 0.2;
  const pocketMat = new THREE.MeshStandardMaterial({ color: 0x6e6e6c, roughness: 0.9 });
  // a1~a2：簾子沿牆範圍；wall：牆內面位置（房間在數值較小的一側）；alongX：牆為南北向（簾子沿 x 展開）
  const shade = (a1, a2, wall, alongX) => {
    const face = wall - cm2px(6);
    const [x1, y1, x2, y2] = alongX ? [a1, face - T, a2, face] : [face - T, a1, face, a2];
    const [px1, py1, px2, py2] = alongX ? [a1, wall - cm2px(13), a2, wall - cm2px(1)] : [wall - cm2px(13), a1, wall - cm2px(1), a2];
    box(px1, py1, px2, py2, BEAM_BOTTOM - 0.3, BEAM_BOTTOM, pocketMat);                     // 窗簾盒軌道槽（暗色示意凹槽開口）
    box(x1, y1, x2, y2, LOW + 2, HIGH - 2, shadeMat);                                       // 簾布
    box(x1, y1, x2, y2, LOW, LOW + 2, railMat);                                             // 下軌（可上下移動）
    box(x1, y1, x2, y2, HIGH - 2, HIGH, railMat);                                           // 中軌（可上下移動）
    box(x1, y1, x2, y2, TOP - 3, TOP, railMat);                                             // 頂部固定上軌（在窗簾盒內）
    const L = alongX ? x2 - x1 : y2 - y1;                                                    // 上軌到中軌的拉繩 x2
    [0.15, 0.85].forEach(t => {
      const c = (alongX ? x1 : y1) + L * t, w = cm2px(0.3);
      if (alongX) box(c - w, y1, c + w, y1 + w, HIGH, TOP - 3, railMat);
      else box(x1, c - w, x1 + w, c + w, HIGH, TOP - 3, railMat);
    });
  };
  shade(458, 618, 1066, true);                                                             // W5 主臥南窗（窗洞 x 455~618；東側收在窗洞邊，讓給床頭牆板）
  shade(740, 913, 958, false);                                                             // W1 主臥東窗（窗洞 y 740~905；北側緊鄰分隔牆，不外擴）
  box(913 - cm2px(15), 541, 913, 770, BEAM_BOTTOM, CEIL_H, mat.beam);                       // W2 次臥東牆窗簾盒（15cm 深，整面牆）
  shade(497, 665, 913, false);                                                             // W2 次臥東窗（窗洞 y 505~657）
}

// 西牆整面衣櫃（深 68cm）：由北而南 C 轉角固定封板（49cm，被電子衣櫥櫃擋住）→ M 主衣櫃 3 門上下兩段（170cm）→ N 全開放吊衣格（深 40，避開 W5 窗）
// C、M 段頂天（到天花 320cm，上方無樑）；N 段頂到 G2 包樑下緣 245cm
{
  const D = 61.8, xf = MB.wall + cm2px(D), xd = MB.wall + cm2px(D + 1.8), TOP = CEIL_H;   // 淨深 60（櫃體 61.8 含背板、總深約 63.6 含門片）：58x30x82 行李箱可轉向放
  // 設計師圖：總長 230 = 120（轉角 60 + 單門 60）+ 110（雙門各 55）
  const yC = [MB.north, MB.north + cm2px(60)], yM = [yC[1], MB.north + cm2px(230)], yN = [yM[1], MB.south];
  const wFront = (y1, y2, z0, z1, n) => {
    const gap = cm2px(0.4), w = (y2 - y1) / n;
    for (let i = 0; i < n; i++) box(xf, y1 + i * w + gap / 2, xd, y1 + (i + 1) * w - gap / 2, z0 + 0.2, z1 - 0.2, cab.greige);
  };
  solids.push([MB.wall, yC[0], xd, yM[1]]);
  box(MB.wall, yC[0], xf - cm2px(3), yM[1], 0, 8, cab.greige);                                // 內縮踢腳
  // C：轉角固定封板
  // 正面被電子衣櫥櫃擋住、門片無法開啟 → 做成轉角固定封板（死角），外觀與門片齊平
  box(MB.wall, yC[0], xd, yC[1], 8, TOP, cab.greige);
  // M：主衣櫃
  // 內部（720 參考圖）：北側窄格（1 門）+ 南側寬格（2 門對開）；下段各有上下兩支吊衣桿（中間層板 100cm），上段（200cm 以上）再一層層板
  const yDiv = yM[0] + cm2px(60), DE = [yM[0], yDiv, (yDiv + yM[1]) / 2, yM[1]], xr = MB.wall + cm2px(31);
  carcass(MB.wall, yM[0], xf, yM[1], 8, TOP, cab.greige, { face: 'x+', shelves: [100, 200, 260], dividers: [yDiv] });
  [[yM[0], yDiv, 96], [yDiv, yM[1], 93]].forEach(([a, b, zl]) => [zl, 193].forEach(z => {   // 吊衣桿（直徑 2.5cm 圓管，兩端頂到側板 / 中立板）；窄格下桿上移到 96，下方淨高約 85 可立放行李箱
    const m = new THREE.Mesh(new THREE.CylinderGeometry(cm2m(1.25), cm2m(1.25), px2m(b - a - cm2px(2.7)), 20).rotateX(Math.PI / 2), cab.steel);
    m.position.set(px2m(xr - ORIGIN.x), cm2m(z), px2m((a + b) / 2 - ORIGIN.y));
    scene.add(m);
  }));
  box(xr - cm2px(22), yDiv + cm2px(10), xr + cm2px(22), yDiv + cm2px(60), 201.8, 228, cab.white);                               // 上層收納箱
  // 門片：窄格鉸鍊在中立板（避免打到電子衣櫥），寬格兩片對開
  const wDoor = (i, z0, z1, hinge) => hingeDoor(xf, DE[i] + cm2px(0.2), xd, DE[i + 1] - cm2px(0.2), z0 + 0.2, z1 - 0.2, cab.greige, { hinge, out: 1, angle: 95 });
  [[8, 200], [200, TOP]].forEach(([z0, z1]) => { wDoor(0, z0, z1, 'max'); wDoor(1, z0, z1, 'min'); wDoor(2, z0, z1, 'max'); });
  // N：開放吊衣格（深 40cm）
  const xn = MB.wall + cm2px(40);
  // 全開放、無上櫃，上方直接接包樑；只有一支吊衣桿
  box(MB.wall, yN[0], xn, yN[0] + cm2px(7), BEAM_BOTTOM, CEIL_H, mat.beam);                 // 與 G2 包樑之間補平
  // 吊衣桿上下兩支（依參考圖）：上桿貼近包樑下緣（235cm）、下桿 170cm；直徑 2.5cm 圓管，北端鎖在主衣櫃側板、南端鎖在南牆，兩端各一個法蘭座
  {
    const ya = yN[0], yb = yN[1], xc = MB.wall + cm2px(20);
    const rodMesh = (len, r, yMid, zc) => {
      const m = new THREE.Mesh(new THREE.CylinderGeometry(cm2m(r), cm2m(r), px2m(len), 20).rotateX(Math.PI / 2), cab.steel);
      m.position.set(px2m(xc - ORIGIN.x), cm2m(zc), px2m(yMid - ORIGIN.y));
      m.castShadow = true;
      scene.add(m);
    };
    [235, 170].forEach(zc => {
      rodMesh(yb - ya, 1.25, (ya + yb) / 2, zc);
      rodMesh(cm2px(1.2), 3, ya + cm2px(0.6), zc);
      rodMesh(cm2px(1.2), 3, yb - cm2px(0.6), zc);
    });
  }
}

// ---------- 主臥立燈：IKEA ISJAKT LED 上照落地燈 / 閱讀燈（鍍鎳，高 180、寬 50、底座 Ø24）----------
// 兩支：主臥床頭板西側（燈臂朝東伸向床）、客廳沙發與餐桌之間（燈臂朝西伸向沙發）。上照 1850 lm、閱讀燈 350 lm，2700K，面板「立燈」按鈕一起開關（預設開）
// s = 閱讀燈臂方向（+1 朝東 / -1 朝西）；回傳開關函式
function isjakt(LX, LY, s = 1) {
  const nickel = new THREE.MeshStandardMaterial({ color: 0xc8c8c4, metalness: 0.3, roughness: 0.3 });
  const rubber = new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.9 });
  const P = (x, y, z) => new THREE.Vector3(px2m(x - ORIGIN.x), cm2m(z), px2m(y - ORIGIN.y));
  const tube = (a, b, rCm) => {                                                        // 兩點之間的圓管
    const d = b.clone().sub(a), m = new THREE.Mesh(new THREE.CylinderGeometry(cm2m(rCm), cm2m(rCm), d.length(), 16), nickel);
    m.position.copy(a).add(b).multiplyScalar(0.5);
    m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), d.normalize());
    m.castShadow = true; scene.add(m);
  };
  const X2 = LX + s * cm2px(6), ARM = LX + s * cm2px(38);                                      // 第二支管（閱讀燈）在主管東側 6cm；燈臂伸到 38cm
  cyl(LX + s * cm2px(3), LY, 11, 0, 0.8, rubber);                                         // 底座止滑墊
  cyl(LX + s * cm2px(3), LY, 12, 0.8, 2.8, nickel);                                       // 圓底座 Ø24
  cyl(LX, LY, 0.9, 2.8, 177, nickel);                                                 // 主管
  cyl(LX, LY, 13, 177, 179, nickel);                                                  // 上照燈罩（淺盤 Ø26）
  cyl(LX, LY, 2.5, 175, 177, nickel);
  cyl(X2, LY, 0.8, 2.8, 102, nickel);                                                 // 閱讀燈管
  box(Math.min(LX, X2) - cm2px(1), LY - cm2px(2.5), Math.max(LX, X2) + cm2px(1), LY + cm2px(2.5), 74, 88, nickel); // 開關 / 調光座
  tube(P(X2, LY, 102), P(X2 + s * cm2px(3), LY, 109), 0.8);                               // 彎管
  tube(P(X2 + s * cm2px(3), LY, 109), P(ARM, LY, 113), 0.8);                              // 燈臂（微上揚）
  cyl(ARM - s * cm2px(2), LY, 0.5, 108.5, 113, nickel);                                   // 吊頭
  cyl(ARM - s * cm2px(2), LY, 5, 106, 108.5, nickel);                                     // 閱讀燈頭 Ø10
  const glowUp = new THREE.MeshBasicMaterial({ color: 0x3a3226 }), glowRd = new THREE.MeshBasicMaterial({ color: 0x3a3226 });
  const up = new THREE.Mesh(new THREE.CircleGeometry(cm2m(11.5), 32).rotateX(-Math.PI / 2), glowUp);
  up.position.copy(P(LX, LY, 179.1)); scene.add(up);
  const rd = new THREE.Mesh(new THREE.CircleGeometry(cm2m(4.2), 24).rotateX(Math.PI / 2), glowRd);
  rd.position.copy(P(ARM - s * cm2px(2), LY, 105.9)); scene.add(rd);
  const lUp = spot(P(LX, LY, 182), P(LX, LY, 320), { lm: 1850, angle: 140, distance: 6 });   // 上照：打天花再漫射
  const lRd = spot(P(ARM - s * cm2px(2), LY, 105), P(ARM + s * cm2px(10), LY - cm2px(30), 50), { lm: 350, angle: 70, distance: 3 });   // 閱讀燈：斜照床頭
  const I = [lUp.intensity, lRd.intensity];
  solids.push([Math.min(LX - s * cm2px(9), LX + s * cm2px(15)), LY - cm2px(12), Math.max(LX - s * cm2px(9), LX + s * cm2px(15)), LY + cm2px(12)]);
  return (on) => {
    lUp.intensity = on ? I[0] : 0; lRd.intensity = on ? I[1] : 0;
    glowUp.color.set(on ? 0xfff0d8 : 0x3a3226); glowRd.color.set(on ? 0xfff0d8 : 0x3a3226);
  };
}

// ---------- 主臥：宜得利懶骨頭沙發（卡其色，約 Ø70 x 高 45cm）----------
// 放在床東側、MODO 收納櫃前與柱子包板之間的地板（x 816~917 的空地）；軟塌的豆袋外型：底部壓平、頂面凹陷、略往後靠
{
  const bx = 866, by = 905, R = 0.36, H = 0.45;
  const geo = new THREE.SphereGeometry(1, 48, 32);
  const p = geo.attributes.position, v = new THREE.Vector3();
  for (let i = 0; i < p.count; i++) {
    v.fromBufferAttribute(p, i);
    let y = v.y;
    const sag = 1 + 0.12 * Math.max(0, -y);                                                // 下半部往外鼓
    let x = v.x * sag, z = v.z * sag;
    if (y < -0.55) y = -0.55 - (y + 0.55) * 0.08;                                            // 底部壓平貼地
    const r = Math.hypot(v.x, v.z);
    if (y > 0.3) y -= 0.35 * Math.max(0, 1 - r * 1.6) * (y - 0.3) * 2.2;                    // 頂面坐出凹陷
    if (v.z > 0 && y > 0) y += 0.25 * v.z * y;                                               // 背側（東）略高，像靠背
    y += 0.03 * Math.sin(v.x * 9 + v.z * 7);                                                 // 布面皺褶
    p.setXYZ(i, x, y, z);
  }
  geo.computeBoundingBox();
  const bb = geo.boundingBox;
  geo.translate(0, -bb.min.y, 0);
  geo.scale(R, H / (bb.max.y - bb.min.y), R);
  geo.rotateY(-Math.PI / 2);                                                                 // 靠背朝東牆
  geo.computeVertexNormals();
  const bag = new THREE.Mesh(geo, fabric(0xa99f86));   // 卡其（偏灰，暖光下不偏橘）
  bag.position.set(px2m(bx - ORIGIN.x), 0, px2m(by - ORIGIN.y));
  bag.castShadow = bag.receiveShadow = true;
  scene.add(bag);
  solids.push(Object.assign([bx - cm2px(34), by - cm2px(34), bx + cm2px(34), by + cm2px(34)], { seat: true, top: 32 }));
}

// ---------- 主臥床頭櫃：Mr.Living Fishbone 收納邊几（白橡木魚骨拼花，寬 45 x 深 40 x 高 59，腳高 18.3）----------

{

  const yb = MB.south - cm2px(1) - cm2px(BED.hb), yf = yb - D;
  const oak = new THREE.MeshStandardMaterial({ map: makeGrainTexture('#d4ab80', '150,100,62', { n: 110, alpha: 0.2 }), roughness: 0.55 });
  const chevron = (() => {                                                                   // 魚骨拼花：左右兩半斜紋在中線相接成 V
    const c = document.createElement('canvas'); c.width = 256; c.height = 128;
    const g = c.getContext('2d');
    g.fillStyle = '#cfa47a'; g.fillRect(0, 0, 256, 128);
    for (let k = 0; k < 90; k++) {
      const y0 = Math.random() * 300 - 150, a = 0.08 + Math.random() * 0.14;
      g.strokeStyle = `rgba(${Math.random() < 0.5 ? '150,98,58' : '235,205,165'},${a})`; g.lineWidth = 0.8 + Math.random() * 2;
      g.beginPath(); g.moveTo(0, y0); g.lineTo(128, y0 + 70); g.stroke();                   // 左半：往中線向下
      g.beginPath(); g.moveTo(256, y0); g.lineTo(128, y0 + 70); g.stroke();                 // 右半：對稱
    }
    for (let x = 32; x < 256; x += 32) { g.strokeStyle = 'rgba(120,80,45,.18)'; g.lineWidth = 1; g.beginPath(); g.moveTo(x, 0); g.lineTo(x, 128); g.stroke(); }   // 拼板縫
    const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
    return new THREE.MeshStandardMaterial({ map: t, roughness: 0.55 });
  })();
  const blk = new THREE.MeshStandardMaterial({ color: 0x1c1c1c, roughness: 0.6 });
  const L = 18.3, H = 59, T = cm2px(1.8);
  solids.push(Object.assign([x1, yf, x2, yb], { top: H }));
  box(x1, yf, x2, yb, H - 1.8, H, oak);                                                      // 頂板
  box(x1, yf, x2, yb, L, L + 1.8, oak);                                                      // 底板
  box(x1, yf, x1 + T, yb, L, H, oak); box(x2 - T, yf, x2, yb, L, H, oak);                    // 側板
  box(x1, yb - cm2px(1), x2, yb, L, H, oak);                                                 // 背板
  // A 字外斜腳（四角往外斜 3cm）+ 左右橫撐
  const P = (x, y, z) => new THREE.Vector3(px2m(x - ORIGIN.x), cm2m(z), px2m(y - ORIGIN.y));
  [[x1 + cm2px(5), yf + cm2px(5), -1, -1], [x2 - cm2px(5), yf + cm2px(5), 1, -1], [x1 + cm2px(5), yb - cm2px(5), -1, 1], [x2 - cm2px(5), yb - cm2px(5), 1, 1]].forEach(([lx, ly, sx, sy]) => {
    const a = P(lx, ly, L), b = P(lx + sx * cm2px(2.5), ly + sy * cm2px(2.5), 0), d = b.clone().sub(a);
    const m = new THREE.Mesh(new THREE.CylinderGeometry(cm2m(1.9), cm2m(1.5), d.length(), 16), oak);
    m.position.copy(a).add(b).multiplyScalar(0.5); m.quaternion.setFromUnitVectors(new THREE.Vector3(0, -1, 0), d.normalize()); m.castShadow = true; scene.add(m);
  });
  [x1 + cm2px(4.2), x2 - cm2px(5.8)].forEach(sx => box(sx, yf + cm2px(5), sx + cm2px(1.6), yb - cm2px(5), 7, 8.6, oak));   // 橫撐
  // 抽屜 x2（框內前緣內縮 0.5cm）
  const zA = L + 1.8, zB = H - 1.8, zM = (zA + zB) / 2, fx1 = x1 + T, fx2 = x2 - T, fy = yf + cm2px(0.5), mid = (fx1 + fx2) / 2;
  [[zA + 0.2, zM - 0.2], [zM + 0.2, zB - 0.2]].forEach(([z0, z1]) => {
    const g = new THREE.Group(); scene.add(g);
    const o = { group: g };
    const tri = new THREE.Shape(); tri.moveTo(-0.035, 0); tri.lineTo(0.035, 0); tri.lineTo(0, -0.028); tri.closePath();   // 三角信封把手（黑色凹槽）
    const hm = new THREE.Mesh(new THREE.ShapeGeometry(tri), blk);
    hm.rotation.y = Math.PI; hm.position.set(px2m(mid - ORIGIN.x), cm2m(z1), px2m(fy - ORIGIN.y) - 0.0015); g.add(hm);
    const parts = [
      box(fx1 + cm2px(0.2), fy, fx2 - cm2px(0.2), fy + cm2px(1.8), z0, z1, chevron, o),       // 魚骨拼花面板
      box(fx1 + cm2px(1), fy + cm2px(1.8), fx1 + cm2px(2.2), yb - cm2px(3), z0, z1 - 3, oak, o),
      box(fx2 - cm2px(2.2), fy + cm2px(1.8), fx2 - cm2px(1), yb - cm2px(3), z0, z1 - 3, oak, o),
      box(fx1 + cm2px(1), fy + cm2px(1.8), fx2 - cm2px(1), yb - cm2px(3), z0, z0 + 1, oak, o),
      hm,
    ];
    mover(g, k => { g.position.z = -px2m(cm2px(28)) * k; }, parts);

}

    [[700, 9, 18], [707, 7, 18], [716, 6, 7]].forEach(([y, r, h]) => cyl(x1 + cm2px(22), y, r / 2, zs[2], zs[2] + h, cab.white));   // 瓶罐

  // 3. 北側吊櫃（依參考圖）：東北角 J5 樑下凹處（RC 牆 y 486），寬 135（45 x 3）、深 30cm（設計師圖），東側離窗牆約 25cm，櫃頂貼樑下緣
  //    門片為霧面暖灰（非木紋）；左門做到櫃底、右下角切 1/4 圓弧露出開放格，中、右門只到開放格上緣；
  //    下段開放格 3 格（洗白木紋），櫃底板略凸出；上段內部 3 格、各 2 層
  {
    const x1 = 750, x2 = 750 + cm2px(135), yb = 486, yf = yb + cm2px(30), zTop = CEIL_H - (60 - SLAB), zDoor = 200, zBot = 173, w = (x2 - x1) / 3;

// ---------- 浴室（依現場照片）----------
// 配置（由門口往內看）：正前方西牆靠北 = 壁掛浴櫃 + 檯面盆 + 無框鏡；其南側 = 馬桶（背靠西牆）；
// 西南角 = 管道間凸柱；東南 = 淋浴間（玻璃固定片 + 外開玻璃門、南牆淋浴龍頭 + 升降桿、線型排水）
// 牆面 30x60 淺米灰石紋磚（橫貼）、地面 60x60 灰磚、平頂天花（估 235cm）+ 崁燈 + 暖風乾燥機
{
  const B = { x1: 415, x2: 557, y1: 537, y2: 770 }, CH = 235, t = cm2px(0.6);
  const makeTile = (base, vein, grout) => {
    const c = document.createElement('canvas');
    c.width = 512; c.height = 256;
    const g = c.getContext('2d');
    g.fillStyle = base; g.fillRect(0, 0, 512, 256);
    for (let k = 0; k < 26; k++) {                                   // 淡石紋
      g.strokeStyle = `rgba(${vein},${0.05 + Math.random() * 0.12})`;
      g.lineWidth = 1 + Math.random() * 5;
      let x = Math.random() * 512, y = Math.random() * 256;
      g.beginPath(); g.moveTo(x, y);
      for (let i = 0; i < 6; i++) { x += 40 + Math.random() * 70; y += (Math.random() - 0.5) * 50; g.lineTo(x, y); }
      g.stroke();
    }
    g.strokeStyle = grout; g.lineWidth = 3; g.strokeRect(0, 0, 512, 256);                 // 填縫
    const tx = new THREE.CanvasTexture(c);
    tx.colorSpace = THREE.SRGBColorSpace;
    tx.wrapS = tx.wrapT = THREE.RepeatWrapping;
    return tx;
  };
  const wallTex = makeTile('#dcd8cf', '255,255,255', '#bfbab0'), floorTex = makeTile('#b9b6ae', '235,232,225', '#9c988f');
  const tiled = (tex, u, v, rough = 0.25) => { const tx = tex.clone(); tx.needsUpdate = true; tx.repeat.set(u, v); return new THREE.MeshStandardMaterial({ map: tx, roughness: rough }); };
  const wallPanel = (x1, y1, x2, y2, z0 = 0, z1 = CH) => box(x1, y1, x2, y2, z0, z1, tiled(wallTex, px2m(Math.max(x2 - x1, y2 - y1)) / 0.6, cm2m(z1 - z0) / 0.3));
  wallPanel(B.x1, B.y1, B.x2, B.y1 + t);                              // 北牆
  wallPanel(B.x1, B.y1, B.x1 + t, 680);                               // 西牆

  box(B.x1, B.y1, B.x2, B.y2, 1, 1.3, tiled(floorTex, px2m(B.x2 - B.x1) / 0.6, px2m(B.y2 - B.y1) / 0.6, 0.45));   // 地磚
  box(B.x1, B.y1, B.x2, B.y2, CH, CEIL_H, mat.ceil, { group: ceilingGroup });             // 平頂天花

  const ceramic = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.15 });

  // 壁掛浴櫃（白色，寬 60、深 45、離地 32cm，雙門）+ 人造石檯面 + 檯面盆 + 龍頭 + 無框鏡
  {
    const y1 = 541, y2 = 602, xb = B.x1 + t, xf = xb + cm2px(45), T = cm2px(1.8), ym = (y1 + y2) / 2;
    solids.push([B.x1, y1, xf + T, y2]);

    hingeDoor(xf, y1 + cm2px(0.2), xf + T, ym - cm2px(0.15), 32.3, 73.7, cab.white, { hinge: 'min', out: 1 });
    hingeDoor(xf, ym + cm2px(0.15), xf + T, y2 - cm2px(0.2), 32.3, 73.7, cab.white, { hinge: 'max', out: 1 });
    box(xb, y1 - cm2px(2), xf + cm2px(4), y2 + cm2px(2), 74, 78, cab.white);              // 檯面

    box(xb + cm2px(13), y1 + cm2px(8), xf - cm2px(1), y2 - cm2px(8), 92.9, 93.15, new THREE.MeshStandardMaterial({ color: 0xd9dde0, roughness: 0.1 }));   // 盆內（示意）

  }

  // 馬桶（一體式）：背靠西牆、朝東
  {
    const yc = 641, hw = cm2px(19), xb = B.x1 + t;
    solids.push(Object.assign([B.x1, yc - hw, xb + cm2px(72), yc + hw], { seat: true, top: 44 }));
    softBox(xb, yc - hw, xb + cm2px(30), yc + hw, 0, 54, 5, ceramic);                     // 水箱 / 後段
    softBox(xb + cm2px(22), yc - hw, xb + cm2px(72), yc + hw, 0, 40, 9, ceramic);         // 座體
    const bowl = cyl(xb + cm2px(47), yc, 12, 40, 40.2, new THREE.MeshStandardMaterial({ color: 0x5f6a70, roughness: 0.1 }));   // 便座開口（掀蓋後看得到）
    bowl.scale.x = 1.35;

    const lidMesh = softBox(xb + cm2px(24), yc - hw + cm2px(0.5), xb + cm2px(71), yc + hw - cm2px(0.5), 40, 44, 2, ceramic);
    const o = [xb + cm2px(24), yc, 42], g = pivotAt(...o);

    lid.kind = 'room';
    g.userData.mover = lid;
    let inBath = false, closeTimer = null;
    setInterval(() => {
      const p = camera.position, x = p.x * 100 / CM_PER_PX + ORIGIN.x, y = p.z * 100 / CM_PER_PX + ORIGIN.y;
      const now = p.y < 2.4 && x > B.x1 && x < B.x2 && y > B.y1 && y < B.y2;
      if (now && !inBath) { lid.open = true; clearTimeout(closeTimer); closeTimer = setTimeout(() => { lid.open = false; }, 6000); }
      inBath = now;

  }

  // 淋浴間：玻璃隔間沿 y 680（x 455~557），固定片在管道間側、玻璃門在東牆側往外開
  {
    const y = 680, xm = 505, g = cm2px(0.5);

    box(455 + t, y - g, xm - cm2px(1), y + g, 3, 198, mat.glass);                         // 固定片

  cyl(500, 665, 8, CH - 0.4, CH, fixtureMat.white);

  box(470, 585, 512, 618, CH - 3, CH, fixtureMat.white);                                  // 暖風乾燥機面板
  box(476, 589, 490, 600, CH - 3.2, CH - 3, fixtureMat.black);                            // 出風格柵

// ---------- 次臥：Backbone Allround Desk 電動升降桌（130 x 70，72~116cm，羊絨米灰）----------
// 放在北側吊櫃正下方（背靠北牆 y 486，左右置中於吊櫃 x 750~888）；桌面前段暖灰、後段米白，T 型腳
// 點桌面（或準星對準按 E）切換坐姿 72cm / 站姿 110cm；吊櫃開放格底 173cm，站姿桌面上方仍有約 63cm

// 平均照度 ≈ 直接光（Φ × 利用係數 0.5 / 地板面積）+ 間接照度；rec = CNS 12112 / 一般住宅建議照度（lx）

  { key: 'second',  name: '次臥',     rects: [[658, 486, 913, 770]], rec: [100, 300], spill: 0 },

  { key: 'living',  name: '客餐廳 / 廚房 / 玄關', rects: [[23, 207, 750, 541]], rec: [150, 300], spill: 0 },
];
const RHO = 0.6, UF = 0.5;
ROOMS.forEach(r => {
  const [x1, y1, x2, y2] = r.rects[0], w = px2m(x2 - x1), d = px2m(y2 - y1), h = cm2m(CEIL_H);
  r.area = r.rects.reduce((a, [a1, b1, a2, b2]) => a + px2m(a2 - a1) * px2m(b2 - b1), 0);
  r.lm = ROOM_LM[r.key] || 0;
  r.indirect = r.lm * RHO / ((2 * r.area + 2 * (w + d) * h) * (1 - RHO)) + r.spill;   // spill：沒有燈的空間從相鄰房間門口漏進來的光（估計值）
  r.avg = r.lm * UF / r.area + r.indirect;
});
console.table(ROOMS.map(r => ({ 房間: r.name, '光通量 lm': Math.round(r.lm), '面積 m²': +r.area.toFixed(1), '間接 lx': Math.round(r.indirect), '平均 lx': Math.round(r.avg), '建議 lx': r.rec.join('~') })));
{
  const rects = [], lux = [];
  ROOMS.forEach(r => r.rects.forEach(([x1, y1, x2, y2]) => {

    lux.push(r.indirect);
  }));
  const uniforms = { uRoomRect: { value: rects }, uRoomLux: { value: lux }, uRoomDefault: { value: 30 } };
  const N = rects.length;
  const decl = `uniform vec4 uRoomRect[${N}]; uniform float uRoomLux[${N}]; uniform float uRoomDefault;
    float roomLux(vec2 p) { for (int i = 0; i < ${N}; i++) { vec4 r = uRoomRect[i]; if (p.x >= r.x && p.x <= r.z && p.y >= r.y && p.y <= r.w) return uRoomLux[i]; } return uRoomDefault; }`;
  const patched = new Set();
  scene.traverse(o => {
    const m = o.material;
    if (!m || !m.isMeshStandardMaterial || patched.has(m)) return;
    patched.add(m);
    m.onBeforeCompile = (sh) => {
      Object.assign(sh.uniforms, uniforms);
      sh.vertexShader = sh.vertexShader.replace('#include <common>', 'varying vec3 vRoomPos;\n#include <common>')
        .replace('#include <project_vertex>', '#include <project_vertex>\nvRoomPos = (modelMatrix * vec4(transformed, 1.0)).xyz;');
      sh.fragmentShader = sh.fragmentShader.replace('#include <common>', 'varying vec3 vRoomPos;\n' + decl + '\n#include <common>')
        .replace('#include <lights_fragment_begin>', '#include <lights_fragment_begin>\nirradiance *= roomLux(vRoomPos.xz);');
    };
    m.customProgramCacheKey = () => 'roomLux';
    m.needsUpdate = true;
  });
}

  e.stopPropagation();
  setShowcase((showcaseMode + 1) % SHOWCASE_MODES.length);
  btnShowcase.textContent = `展示櫃：${SHOWCASE_MODES[showcaseMode]}`;
};
btnLabel.onclick = (e) => {
  e.stopPropagation();
  labelGroup.visible = !labelGroup.visible;
  btnLabel.textContent = `樑標籤：${labelGroup.visible ? '開' : '關'}`;
  btnLabel.classList.toggle('off', !labelGroup.visible);
};
// 姿勢切換
const postureBtns = [...document.querySelectorAll('#postures button')];
function setPosture(i) {
  posture = i;
  postureBtns.forEach((b, k) => b.classList.toggle('off', k !== i));
}
postureBtns.forEach((b, k) => { b.onclick = (e) => { e.stopPropagation(); setPosture(k); }; });

// 櫃門 / 抽屜 / 上掀蓋互動：漫遊模式以準星（畫面中心）選取，俯瞰模式以滑鼠位置選取；被牆或其他物件擋住的不會選到
const ray = new THREE.Raycaster();
const CENTER = new THREE.Vector2(0, 0);
const shown = (o) => { for (; o; o = o.parent) if (!o.visible) return false; return true; };
function pick(ndc, far) {
  ray.setFromCamera(ndc, camera);
  ray.far = far;
  for (const h of ray.intersectObjects(scene.children, true)) {
    const o = h.object;
    if (!o.isMesh || !shown(o) || o.material.transparent) continue;
    for (let q = o; q; q = q.parent) if (q.userData.mover) return q.userData.mover;
    return null;
  }
  return null;
}
let exposureIdx = 0;
const btnBright = document.getElementById('btnBright');
btnBright.onclick = (e) => {
  e.stopPropagation();
  exposureIdx = (exposureIdx + 1) % EXPOSURES.length;
  renderer.toneMappingExposure = 1.1 / 118 * EXPOSURES[exposureIdx].k;
  btnBright.textContent = `曝光：${EXPOSURES[exposureIdx].name}`;
};
let woodIdx = 0;
const btnWood = document.getElementById('btnWood');
let lampOn = true;
const btnLamp = document.getElementById('btnLamp');
btnLamp.onclick = (e) => {
  e.stopPropagation();
  lampOn = !lampOn; floorLamp(lampOn);
  btnLamp.textContent = `立燈：${lampOn ? '開' : '關'}`; btnLamp.classList.toggle('off', !lampOn);
};
btnWood.onclick = (e) => {
  e.stopPropagation();
  woodIdx = (woodIdx + 1) % BEDROOM_WOODS.length;
  const w = BEDROOM_WOODS[woodIdx];
  cab.paleGrain.map = w.shell; cab.paleGrain.color.set(w.shellColor); cab.paleGrain.needsUpdate = true;
  cab.bedWood.map = w.bed; cab.bedWood.needsUpdate = true;
  if (nichePegMat) nichePegMat.color.set(w.peg);
  btnWood.textContent = `臥室櫃色：${BEDROOM_WOODS[woodIdx].name}`;
};
btnWood.onclick(new Event('click'));   // 預設切到「橡木」
const btnDoors = document.getElementById('btnDoors');
function syncDoorsBtn() {
  const any = movers.some(m => m.kind !== 'room' && m.open);
  btnDoors.textContent = `櫃門：${any ? '全關' : '全開'}`;
  btnDoors.classList.toggle('off', !any);
}
function interact(ndc, far) {
  const m = pick(ndc, far);
  if (m) { m.open = !m.open; syncDoorsBtn(); }
}
btnDoors.onclick = (e) => {
  e.stopPropagation();
  const open = !movers.some(m => m.kind !== 'room' && m.open);
  movers.forEach(m => { if (m.kind !== 'room') m.open = open; });   // 房門、拉門不跟著全開 / 全關
  syncDoorsBtn();
};
syncDoorsBtn();
renderer.domElement.addEventListener('click', () => {
  if (mode !== 'walk' || IS_TOUCH) return;           // 觸控裝置不鎖滑鼠，輕點由下方觸控段處理
  if (!walk.isLocked) walk.lock(); else interact(CENTER, 3.2);
});
let downAt = null;
renderer.domElement.addEventListener('pointerdown', (e) => { downAt = [e.clientX, e.clientY]; });
renderer.domElement.addEventListener('pointerup', (e) => {
  if (mode !== 'orbit' || !downAt || Math.hypot(e.clientX - downAt[0], e.clientY - downAt[1]) > 4) return;
  interact(new THREE.Vector2(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1), 100);
});
walk.addEventListener('lock', updateUI);
walk.addEventListener('unlock', updateUI);

// ---------- 手機 / 平板觸控操作 ----------
// 漫遊：左下虛擬搖桿移動；畫面其他地方單指拖曳轉視角；輕點（不拖曳）= 開關點到的房門 / 櫃門 / 抽屜；右下懸浮按鈕：跳、姿勢
// 其他操作（俯瞰 / 漫遊切換、天花板、櫃門、曝光…）都在左上可收合的面板，手機上預設收合
const joy = { active: false, id: null, x: 0, y: 0, cx: 0, cy: 0 };
const btnUse = document.getElementById('btnUse');
if (IS_TOUCH) {
  const base = document.getElementById('joyBase'), stick = document.getElementById('joyStick'), R = 50;
  const look = { id: null, x: 0, y: 0, moved: 0, t: 0 }, euler = new THREE.Euler(0, 0, 0, 'YXZ');
  const moveJoy = (t) => {
    let dx = t.clientX - joy.cx, dy = t.clientY - joy.cy;
    const d = Math.hypot(dx, dy);
    if (d > R) { dx *= R / d; dy *= R / d; }
    joy.x = dx / R; joy.y = dy / R;
    stick.style.transform = `translate(${dx}px, ${dy}px)`;
  };
  base.addEventListener('touchstart', (e) => {
    e.preventDefault();
    const t = e.changedTouches[0], r = base.getBoundingClientRect();
    Object.assign(joy, { active: true, id: t.identifier, cx: r.left + r.width / 2, cy: r.top + r.height / 2 });
    moveJoy(t);
  }, { passive: false });
  renderer.domElement.addEventListener('touchstart', (e) => {
    if (mode !== 'walk' || look.id !== null) return;
    e.preventDefault();
    const t = e.changedTouches[0];
    Object.assign(look, { id: t.identifier, x: t.clientX, y: t.clientY, moved: 0, t: performance.now() });
  }, { passive: false });
  addEventListener('touchmove', (e) => {
    for (const t of e.changedTouches) {
      if (t.identifier === joy.id) moveJoy(t);
      else if (t.identifier === look.id && mode === 'walk') {
        const dx = t.clientX - look.x, dy = t.clientY - look.y;
        look.x = t.clientX; look.y = t.clientY; look.moved += Math.abs(dx) + Math.abs(dy);
        euler.setFromQuaternion(camera.quaternion);
        euler.y -= dx * 0.005;
        euler.x = Math.max(-1.45, Math.min(1.45, euler.x - dy * 0.005));
        camera.quaternion.setFromEuler(euler);
      }
    }
  }, { passive: false });
  const end = (e) => {
    for (const t of e.changedTouches) {
      if (t.identifier === joy.id) { Object.assign(joy, { active: false, id: null, x: 0, y: 0 }); stick.style.transform = ''; }
      if (t.identifier === look.id) {
        if (mode === 'walk' && look.moved < 12 && performance.now() - look.t < 400)
          interact(new THREE.Vector2(t.clientX / innerWidth * 2 - 1, -(t.clientY / innerHeight) * 2 + 1), 3.5);
        look.id = null;
      }
    }
  };
  addEventListener('touchend', end);
  addEventListener('touchcancel', end);
  const btnPosture = document.getElementById('btnPosture');
  btnUse.addEventListener('touchstart', (e) => { e.preventDefault(); if (mode === 'walk') interact(CENTER, 3.5); }, { passive: false });   // 開關準星對準的門 / 櫃門
  document.getElementById('btnJump').addEventListener('touchstart', (e) => { e.preventDefault(); if (mode === 'walk' && jumpV === 0) jumpV = 3.5; }, { passive: false });
  btnPosture.addEventListener('touchstart', (e) => { e.preventDefault(); setPosture((posture + 1) % POSTURES.length); btnPosture.textContent = POSTURES[posture].name[0]; }, { passive: false });
}

const keys = {};
addEventListener('keydown', (e) => {
  if (e.code === 'Tab') { e.preventDefault(); setMode(mode === 'walk' ? 'orbit' : 'walk'); return; }
  if (e.code === 'KeyC' && !e.repeat) setPosture((posture + 1) % POSTURES.length);
  if ((e.code === 'KeyE' || e.code === 'KeyF') && !e.repeat && mode === 'walk' && walk.isLocked) interact(CENTER, 3.2);
  if (e.code === 'Space') {                       // 跳：起跳速度 3.5 m/s、重力 9.8 → 約跳高 62cm；擋掉空白鍵觸發最後點過的按鈕
    e.preventDefault();
    if (!e.repeat && mode === 'walk' && walk.isLocked && jumpV === 0) jumpV = 3.5;   // 站在地上或家具上時才能起跳（起跳 3.5 m/s → 跳高約 62cm）
  }
  keys[e.code] = true;
});
addEventListener('keyup', (e) => { keys[e.code] = false; });

// 腳下地面高度（m）：玩家中心落在有 top（cm）的矮家具上、且頂面不高於目前腳高 + 5cm 時，就站在它上面
function groundAt(xm, zm) {
  const x = xm * 100 / CM_PER_PX + ORIGIN.x, y = zm * 100 / CM_PER_PX + ORIGIN.y;
  let g = 0;
  for (const s of solids) {
    if (s.top === undefined || s.top / 100 > jumpY + 0.05) continue;
    if (x >= s[0] && x <= s[2] && y >= s[1] && y <= s[3]) g = Math.max(g, s.top / 100);
  }
  return g;
}
// 2D 圓形 vs 矩形碰撞（px 座標）
const RADIUS_PX = 20;
function blocked(xm, zm) {
  const x = xm * 100 / CM_PER_PX + ORIGIN.x;
  const y = zm * 100 / CM_PER_PX + ORIGIN.y;
  return solids.some((s) => {
    if (posture !== 0 && s.seat) return false;
    if (s.gate && s.gate.open) return false;
    if (s.top !== undefined && jumpY >= s.top / 100 - 0.02) return false;   // 有高度的矮家具：腳高過它的頂面就能越過 / 站上去        // 房門 / 拉門開著時可通過      // 坐下 / 蹲下 / 躺下時可進入沙發、椅子、床、架高地板
    const [x1, y1, x2, y2] = s;
    const cx = Math.max(x1, Math.min(x, x2));
    const cy = Math.max(y1, Math.min(y, y2));
    return (x - cx) ** 2 + (y - cy) ** 2 < RADIUS_PX ** 2;
  });
}

const clock = new THREE.Clock();
let jumpY = 0, jumpV = 0, eyeY = EYE;              // 腳底離地高度（m，站在家具上 > 0）/ 垂直速度（m/s）/ 目前姿勢眼高（平滑過渡）
let hoverT = 0;
const fwd = new THREE.Vector3(), right = new THREE.Vector3();
function tick() {
  const dt = Math.min(clock.getDelta(), 0.05);
  // 櫃門 / 抽屜補間
  let moving = false;
  movers.forEach(m => {
    const target = m.open ? 1 : 0;
    if (m.t === target) return;
    m.t = target > m.t ? Math.min(1, m.t + dt * 2.4) : Math.max(0, m.t - dt * 2.4);
    m.apply(m.t * m.t * (3 - 2 * m.t));
    moving = true;
  });
  if (moving) renderer.shadowMap.needsUpdate = true;
  updateLux(dt);
  if (mode === 'walk' && (walk.isLocked || IS_TOUCH)) {
    const speed = (keys.ShiftLeft || keys.ShiftRight ? 3.2 : 1.6) * dt;
    camera.getWorldDirection(fwd);
    fwd.y = 0; fwd.normalize();
    right.crossVectors(fwd, camera.up).normalize();
    const mv = new THREE.Vector3();
    if (keys.KeyW) mv.add(fwd);
    if (keys.KeyS) mv.sub(fwd);
    if (keys.KeyD) mv.add(right);
    if (keys.KeyA) mv.sub(right);
    if (joy.active) { mv.addScaledVector(fwd, -joy.y); mv.addScaledVector(right, joy.x); }   // 觸控搖桿
    if (mv.lengthSq() > 0) {
      mv.normalize().multiplyScalar(speed * (joy.active ? Math.min(1, Math.hypot(joy.x, joy.y)) : 1));   // 搖桿推越遠走越快
      const p = camera.position;
      const stuck = blocked(p.x, p.z);              // 已卡在物件內時放行，避免完全無法移動
      if (stuck || !blocked(p.x + mv.x, p.z)) p.x += mv.x;   // 分軸移動，可沿牆滑行
      if (stuck || !blocked(p.x, p.z + mv.z)) p.z += mv.z;
    }
    eyeY += (POSTURES[posture].eye - eyeY) * Math.min(1, dt * 8);
    const ground = groundAt(camera.position.x, camera.position.z);
    if (jumpV !== 0 || jumpY > ground) { jumpV -= 9.8 * dt; jumpY += jumpV * dt; if (jumpY <= ground) { jumpY = ground; jumpV = 0; } }   // 跳躍 / 從家具上走下去會掉下來
    else jumpY = ground;
    camera.position.y = eyeY + jumpY;
    // 準星對到可開關的櫃門時變色提示
    hoverT += dt;
    if (hoverT > 0.15) {                             // 準星對到可開關的東西：準星變黃，手機的「開關」鍵也亮起
      hoverT = 0;
      const target = pick(CENTER, IS_TOUCH ? 3.5 : 3.2);
      cross.style.background = target ? '#ffd24a' : 'rgba(255,255,255,.7)';
      if (IS_TOUCH) btnUse.classList.toggle('ready', !!target);
    }
  }
  if (orbit.enabled) orbit.update();
  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}

// 依畫布實際顯示大小調整解析度與比例（iOS Safari 轉向後 innerWidth / innerHeight 會延遲更新，所以轉向後再補算一次）
function fitCanvas() {
  const c = renderer.domElement, w = c.clientWidth || innerWidth, h = c.clientHeight || innerHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h, false);
}
addEventListener('resize', fitCanvas);
addEventListener('orientationchange', () => { setTimeout(fitCanvas, 150); setTimeout(fitCanvas, 600); });
if (window.visualViewport) visualViewport.addEventListener('resize', fitCanvas);
fitCanvas();

updateUI();
tick();
</script>
</body>
</html>
